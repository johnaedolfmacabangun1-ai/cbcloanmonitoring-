<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBC Loan Monitoring — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --sidebar:#0c751c; --sidebar-hover:#2e7d9f; --sidebar-active:#3a3d3d;
  --sidebar-text:#e8f7f3; --sidebar-text-dim:#71e3ca;
  --accent:#0eb13f; --accent-dark:#0C8377;
  --blue:#fafbfd;
  --bg:#f5f5f5; --card:#f0f5f7; --border:#676f67;
  --ink:#010101; --ink-soft:#68746E;
  --warn-bg:#FBF0D9; --warn-ink:#8A6A12;
  --risk-bg:#FBE4E1; --risk-ink:#e62510;
  --ok-bg:#0daf3b; --ok-ink:#080f0e;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',Arial;font-size:10px;}
h1,h2,h3{font-family:'Space Grotesk',Arial;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.app-shell{display:flex;min-height:100vh;}
.app-shell{--rail-w:65px;--sidebar-open-w:240px;}
.sidebar{width:var(--sidebar-open-w);flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;padding:16px 10px;position:fixed;top:0;left:0;height:100vh;z-index:60;overflow-x:hidden;overflow-y:auto;transform:translateX(calc(-1 * (var(--sidebar-open-w) - var(--rail-w))));transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s ease;}
.sidebar:hover,.sidebar:focus-within{transform:translateX(0);box-shadow:6px 0 24px rgba(0,0,0,.28);}
/* the rail keeps space in the layout so content never jumps when the sidebar slides open */
.sidebar-rail{width:var(--rail-w);flex-shrink:0;}
/* co0llapsed state: hide every text label, keep icons visible and centred */
.sidebar .nav-item span,.sidebar .sidebar-brand .name,.sidebar .live-pill,.sidebar .branch-box,.sidebar .nav-group-label,.sidebar .sidebar-footer .who,.sidebar .sidebar-footer .signout{opacity:0;transition:opacity .18s ease;white-space:nowrap;}
.sidebar:hover .nav-item span,.sidebar:focus-within .nav-item span,.sidebar:hover .sidebar-brand .name,.sidebar:focus-within .sidebar-brand .name,.sidebar:hover .live-pill,.sidebar:focus-within .live-pill,.sidebar:hover .branch-box,.sidebar:focus-within .branch-box,.sidebar:hover .nav-group-label,.sidebar:focus-within .nav-group-label,.sidebar:hover .sidebar-footer .who,.sidebar:focus-within .sidebar-footer .who,.sidebar:hover .sidebar-footer .signout,.sidebar:focus-within .sidebar-footer .signout{opacity:1;transition:opacity .2s ease .08s;}
/* nudge icons into the visible rail while collapsed */
.sidebar .nav-item,.sidebar .sidebar-brand,.sidebar .sidebar-footer{padding-left:calc(var(--sidebar-open-w) - var(--rail-w) + 8px);transition:padding-left .25s cubic-bezier(.4,0,.2,1);}
.sidebar:hover .nav-item,.sidebar:focus-within .nav-item{padding-left:10px;}
.sidebar:hover .sidebar-brand,.sidebar:focus-within .sidebar-brand{padding-left:8px;}
.sidebar:hover .sidebar-footer,.sidebar:focus-within .sidebar-footer{padding-left:8px;}
::-webkit-scrollbar{width:9px;height:9px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.sidebar-brand .mark{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain;padding:2px;flex-shrink:0;}
.sidebar-brand .name{color:#fff;font-weight:700;font-size:13px;line-height:1.2;}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#f3f7f6;margin:0 4px 14px;}
.live-pill .dot{width:6px;height:6px;border-radius:50%;background:#fc3605;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.branch-box{margin:0 4px 16px;}
.branch-box label{font-size:10.5px;letter-spacing:.05em;color:var(--ink);text-transform:uppercase;display:block;margin-bottom:6px;}
.branch-box select{width:100%;background:var(--sidebar-hover);border:1px solid #edf0ef;color:#fff;border-radius:8px;padding:7px 10px;font-size:11.5px;}
.nav-group{margin-bottom:6px;}
.nav-group-label{font-size:9.5px;letter-spacing:.06em;color:var(--sidebar-text-dim);text-transform:uppercase;padding:12px 10px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sidebar-text);font-size:12px;font-weight:500;cursor:pointer;margin-bottom:2px;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid #1B3D36;display:flex;align-items:center;gap:8px;padding-left:8px;padding-right:4px;min-width:0;}
.sidebar-footer .av{width:32px;height:32px;border-radius:50%;background:#E7A96B;color:#3A2708;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.sidebar-footer .who{min-width:0;overflow:hidden;flex:1;}
.sidebar-footer .who b{display:block;color:#fff;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-footer .who span{display:block;font-size:10.5px;color:var(--sidebar-text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-footer .signout{flex-shrink:0;background:none;border:none;color:var(--ink);font-size:11.5px;text-decoration:underline;white-space:nowrap;cursor:pointer;padding:4px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:20px 32px 0;}
.topbar .bell{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;position:relative;color:var(--ink-soft);}
.topbar .bell .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--risk-ink);}
.topbar .av{width:34px;height:34px;border-radius:50%;background:#8FD6C8;color:#0C4B41;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;}
.content{padding:18px 32px 60px;}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-head h1{font-size:26px;color:var(--ink);font-weight:700;}
.page-head p{margin:6px 0 0;color:var(--ink);font-size:13px;}
.greeting h1{color:var(--ink);}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;border-radius:8px;padding:10px 16px;border:1px solid var(--border);background:#fff;color:var(--ink);white-space:nowrap;box-shadow:0 4px 14px rgba(19,40,31,.04);transition:all .2s ease;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(19,40,31,.08);}
.btn svg{width:15px;height:15px;}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.02);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.danger{color:var(--risk-ink);}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(244,248,245,.96));border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:0 8px 28px rgba(15,25,22,.04);}
.kpi .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.kpi .ic svg{width:17px;height:17px;}
.kpi .lbl{font-size:12.5px;color:var(--ink);}
.kpi .val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:2px;}
.kpi .delta{font-size:11.5px;margin-top:5px;color:var(--ink-soft);}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.panel h2{font-size:16px;color:var(--ink);}
.panel .sub{color:var(--ink);font-size:12.5px;margin:2px 0 16px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between;}
.filter-row .left{display:flex;gap:8px;flex-wrap:wrap;}
.filter-row select,.filter-row input[type=text]{border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:12.5px;background:#fff;color:var(--ink);}
.search-box{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:7px;padding:7px 11px;background:#fff;}
.search-box svg{width:50px;height:10px;color:var(--ink-soft);}
.search-box input{border:none;outline:none;font-size:12.5px;width:150px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);border-bottom:1px solid var(--border);padding:9px 10px;font-weight:600;}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFBF9;}
.empty-row td{text-align:center;color:var(--ink-soft);padding:34px 10px;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink);}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink);}
.badge.risk{background:var(--risk-bg);color:var(--risk-ink);}
.badge.neutral{background:#EFEFEC;color:var(--ink-soft);}
.alert-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.alert-item:last-child{border-bottom:none;}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.alert-dot.risk{background:var(--risk-ink);}
.alert-dot.warn{background:#C68A2E;}
.alert-item .txt strong{font-weight:600;}
.alert-item .meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.report-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:#fff;}
.report-card .ic{width:30px;height:30px;border-radius:8px;background:var(--ok-bg);color:var(--ok-ink);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.report-card h3{font-size:14.5px;color:var(--blue);margin-bottom:4px;}
.report-card p{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
.report-card a{font-size:12.5px;font-weight:600;color:var(--accent-dark);display:inline-flex;align-items:center;gap:4px;}
.tabbed{display:grid;grid-template-columns:220px 1fr;gap:18px;}
.tablist{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:8px;height:fit-content;}
.tablist button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:5px;border:none;background:none;font-size:13px;color:var(--ink-soft);font-weight:500;margin-bottom:2px;}
.tablist button.active{background:var(--ok-bg);color:var(--ok-ink);font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:13px;color:var(--ink);background:#fff;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
.toggle-row .t{font-size:13px;font-weight:500;}
.toggle-row .d{font-size:11.5px;color:var(--ink-soft);}
.switch{width:38px;height:22px;border-radius:999px;background:#D8DCD8;position:relative;flex-shrink:0;border:none;padding:0;}
.switch.on{background:var(--accent);}
.switch .knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
.switch.on .knob{left:19px;}
.stage-track{display:flex;align-items:center;gap:3px;}
.stage-track .seg{width:14px;height:6px;border-radius:3px;background:#E4E7E3;}
.stage-track .seg.filled{background:var(--accent);}
.stage-track .seg.filled.warn{background:#C68A2E;}
.stage-track .seg.filled.risk{background:var(--risk-ink);}
.stage-track .lbl{font-size:11px;color:var(--ink-soft);margin-left:7px;white-space:nowrap;}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.help-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:#fff;}
.help-card h3{font-size:14.5px;color:var(--blue);margin-bottom:8px;}
.help-card ol,.help-card ul{margin:0;padding-left:18px;color:var(--ink-soft);font-size:13px;line-height:1.8;}
.bars{display:flex;align-items:flex-end;gap:16px;height:160px;padding:10px 0;}
.bars .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;}
.bars .barcol .stack{width:70%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;}
.bars .barcol .seg{width:100%;}
.bars .barcol .lbl{font-size:11px;color:var(--ink-soft);text-align:center;}
.overlay{position:fixed;inset:0;background:rgba(15,25,22,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal.wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-head button{background:none;border:none;color:var(--ink-soft);width:26px;height:26px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;position:sticky;bottom:-24px;background:#fff;padding:14px 0 2px;}
.form-section{border-top:1px solid var(--border);margin-top:18px;padding-top:16px;}
.form-section:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.form-section h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-dark);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.form-section h4 .num{width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok-ink);display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.field-row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.mini-note{font-size:11.5px;color:var(--ink-soft);margin:-6px 0 10px;}
.mini-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
.mini-table th{font-size:10px;padding:5px 4px;background:#FAFBF9;border-bottom:1px solid var(--border);}
.mini-table td{padding:4px;border-bottom:none;}
.mini-table input{width:100%;border:1px solid var(--border);border-radius:5px;padding:6px 7px;font-size:12px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all .2s;max-width:320px;}
.toast.show{opacity:1;transform:translateY(0);}

.login-left::before{content:'';position:absolute;inset:0;backdrop-filter:blur(2px);background:linear-gradient(160deg,rgba(15,44,39,.86),rgba(12,131,119,.72)),radial-gradient(circle at 20% 20%,rgba(255,255,255,.07),transparent 45%);}
.login-left .lmark{width:100px;height:100px;border-radius:50%;background:#fff;object-fit:contain;padding:8px;margin-bottom:22px;position:relative;z-index:1;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.login-left h1{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;text-align:center;line-height:1.25;margin:0 0 8px;position:relative;z-index:1;}
.login-left .tagline{color:#8FD6C8;font-size:14px;margin:0 0 34px;position:relative;z-index:1;}
.login-features{list-style:none;padding:0;margin:0;position:relative;z-index:1;width:100%;max-width:320px;}
.login-features li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px;color:#E5EFEC;}
.login-features li .chk{width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.login-features li .chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:32px;}
.login-card{background:#fff;border-radius:16px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.08);}
.login-card .mark{width:56px;height:56px;border-radius:50%;background:#fff;object-fit:contain;display:block;margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.login-card h2{font-size:26px;text-align:center;margin-bottom:4px;}
.login-card .sub{color:var(--ink-soft);font-size:13.5px;text-align:center;margin:0 0 26px;}
.login-card .pw-field{position:relative;}
.login-card .pw-field input{padding-right:38px;}
.login-card .pw-toggle{position:absolute;right:10px;top:34px;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;}
.login-card .pw-toggle svg{width:17px;height:17px;}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px;font-size:12.5px;}
.login-row label{display:flex;align-items:center;gap:6px;color:var(--ink-soft);cursor:pointer;}
.login-row a{color:var(--accent-dark);font-weight:600;text-decoration:none;cursor:pointer;}
.login-err{background:var(--risk-bg);color:var(--risk-ink);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;}
.hidden{display:none !important;}

// only if "Remember me" was checked at sign-in; otherwise it uses
// sessionStorage, which is cleared the moment the tab/browser closes —
// so re-opening the site always asks for a password again by default.
const REMEMBER_FLAG = 'cbc_remember_me';
const authStorage = {
  getItem: (key) => {
    const remember = localStorage.getItem(REMEMBER_FLAG) === '1';
    return (remember ? localStorage : sessionStorage).getItem(key);
  },
  setItem: (key, value) => {
    const remember = localStorage.getItem(REMEMBER_FLAG) === '1';
    (remember ? localStorage : sessionStorage).setItem(key, value);
  },
  removeItem: (key) => {
    localStorage.removeItem(key);
    sessionStorage.removeItem(key);
  }
};

function slaStatus(days){ const sla = state.settings.sla_days||3; if(days>sla) return 'risk'; if(days===sla) return 'warn'; return 'ok'; }
function daysSince(ts){ return Math.max(0, Math.floor((Date.now()-new Date(ts).getTime())/86400000)); }
function requiredDocsFor(productId, securityType, collateralType){
  const p = state.products.find(x=>x.id===productId);
  let base = ['Valid ID','2x2 ID Picture','Proof of membership','Application form'];
  if(p){
    if(/agri/i.test(p.name)) base = base.concat(['Barangay Clearance','Certification of Tillage']);
    else if(/business/i.test(p.name)) base = base.concat(['Business permit','Proof of sales or Proof of Purchases','Barangay Clearance']);
    else if(/salary/i.test(p.name)) base = base.concat(['Certificate of employment','Latest 3 months Payslip','Latest 3 months Bank Statement']);
  }
  if(securityType==='Secured'){
    if(collateralType==='REM / Chattel Mortgage'){
      base = base.concat(['Official Receipt (OR) / Certificate of Registration (CR)','Cancellation of Chattel Mortgage','Certificate of Fullpayment','Official Receipt of Appraisal Fee']);
    } else {
      base = base.concat(['Electronic Copy of Title','Traceback','Tax Clearance','Tax Declaration','Current RETR','Official Receipt of Appraisal Fee']);
    }
  }
  return [...new Set(base)];
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}

async function uploadFileToStorage(pathPrefix, file){
  const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = pathPrefix+'/'+Date.now()+'-'+cleanName;
  const {error} = await sb.storage.from('loan-documents').upload(path, file, {upsert:true});
  if(error) return {error};
  const {data} = sb.storage.from('loan-documents').getPublicUrl(path);
  return {path, url:data.publicUrl, name:file.name};
}

/* ============================================================
   DATA LAYER — every read/write goes through Supabase.
   ============================================================ */
async function fetchTable(name){
  const map = {
    branches: ()=> sb.from('branches').select('*').order('name'),
    profiles: ()=> sb.from('profiles').select('*'),
    products: ()=> sb.from('products').select('*').order('name'),
    clients: ()=> sb.from('clients').select('*').order('name'),
    applications: ()=> sb.from('v_applications').select('*').order('created_at',{ascending:false}),
    documents: ()=> sb.from('documents').select('*'),
    evaluations: ()=> sb.from('evaluations').select('*'),
    creditScores: ()=> sb.from('credit_scores').select('*'),
    settings: ()=> sb.from('settings').select('*').single(),
    auditLog: ()=> sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200),
    notifications: ()=> sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50),
    appraisals: ()=> sb.from('collateral_appraisal').select('*').order('created_at',{ascending:false})
  };
  const {data, error} = await map[name]();
  if(dbErr(error)) return;
  state[name] = data;
}
async function loadAll(){
  await Promise.all(['branches','profiles','products','clients','applications','documents','evaluations','creditScores','settings','auditLog','notifications','appraisals'].map(fetchTable));
}
function docsFor(appId){ return state.documents.filter(d=>d.application_id===appId); }
function evalFor(appId){ return state.evaluations.filter(e=>e.application_id===appId).sort((a,b)=>new Date(b.assigned_at)-new Date(a.assigned_at))[0]; }
function scoreFor(appId){ return state.creditScores.find(s=>s.application_id===appId); }
async function notifyUserByName(fullName, message, applicationId){
  if(!fullName) return;
  const target = state.profiles.find(p=>(p.full_name||'').trim().toLowerCase()===fullName.trim().toLowerCase());
  if(!target) return; // not a signed-in staff account (e.g. plain text name) — nothing to notify
  await sb.from('notifications').insert({user_id:target.id, application_id:applicationId||null, message});
}

/* ---------- REALTIME: keep every open tab in sync ---------- */
function subscribeRealtime(){
  const tables = ['branches','profiles','products','clients','applications','documents','evaluations','credit_scores','settings','notifications','collateral_appraisal'];
  const keyMap = {credit_scores:'creditScores', collateral_appraisal:'appraisals'};
  tables.forEach(t=>{
    sb.channel('rt-'+t).on('postgres_changes', {event:'*', schema:'public', table:t}, async ()=>{
      await fetchTable(keyMap[t]||t);
      renderAll();
    }).subscribe();
  });
}

async function loadProfile(){
  const {data,error} = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if(!error) currentProfile = data;
}
function showLogin(msg){
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  const err = document.getElementById('loginErr');
  err.style.background = ''; err.style.color = '';
  if(msg){ err.textContent = msg; err.classList.remove('hidden'); } else { err.classList.add('hidden'); }
}
async function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  await loadAll();
  subscribeRealtime();
  renderAll();
}
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = (fd.get('username')||'').trim();
  document.getElementById('loginBtn').disabled = true;
  const remember = document.getElementById('rememberMe').checked;
  localStorage.setItem(REMEMBER_FLAG, remember ? '1' : '0');
  const {data: resolvedEmail, error: lookupError} = await sb.rpc('get_email_by_username', {p_username: username});
  if(lookupError || !resolvedEmail){ document.getElementById('loginBtn').disabled = false; showLogin('Invalid username or password'); return; }
  const {data, error} = await sb.auth.signInWithPassword({email:resolvedEmail, password:fd.get('password')});
  document.getElementById('loginBtn').disabled = false;
  if(error){ showLogin('Invalid username or password'); return; }
  currentUser = data.user; await loadProfile(); await showApp();
});
document.getElementById('pwToggle').addEventListener('click', ()=>{
  const pw = document.getElementById('loginPw');
  const showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  document.getElementById('pwToggle').setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
});
document.getElementById('forgotPwLink').addEventListener('click', async ()=>{
  const username = document.querySelector('#loginForm [name="username"]').value.trim();
  if(!username){ showLogin('Enter your username above first, then click "Forgot Password?"'); return; }
  const {data: resolvedEmail} = await sb.rpc('get_email_by_username', {p_username: username});
  // Always show the same message whether or not the username exists, so no one can probe for valid usernames.
  if(resolvedEmail){ await sb.auth.resetPasswordForEmail(resolvedEmail); }
  showLogin();
  const err = document.getElementById('loginErr');
  err.textContent = 'Username exists, a password reset email request has been sent to the administrator.';
  err.style.background = 'var(--ok-bg)'; err.style.color = 'var(--ok-ink)';
  err.classList.remove('hidden');
});
sb.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_OUT'){ currentUser=null; currentProfile=null; showLogin(); }
});
(async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ currentUser = session.user; await loadProfile(); await showApp(); }
  else showLogin();
})();

function openModal(title, bodyHTML, onSubmit, submitLabel, wide){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="overlay"><div class="modal'+(wide?' wide':'')+'"><div class="modal-head"><h3>'+title+'</h3><button type="button" id="mClose">'+ic('x')+'</button></div><form id="mForm" novalidate>'+bodyHTML+'<div class="modal-foot"><button type="button" class="btn" id="mCancel">Cancel</button><button type="submit" class="btn primary" id="mSubmit">'+(submitLabel||'Save')+'</button></div></form></div></div>';
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('mClose').onclick = close;
  document.getElementById('mCancel').onclick = close;
  document.getElementById('mForm').onsubmit = async (e)=>{
    e.preventDefault();
    const formEl = e.target;
    if(!formEl.checkValidity()){ formEl.reportValidity(); return; }
    const fd = new FormData(formEl); const data = {}; for(const [k,v] of fd.entries()) data[k]=v;
    document.getElementById('mSubmit').disabled = true;
    await onSubmit(data, close);
    document.getElementById('mSubmit').disabled = false;
  };
  return close;
}

function renderAll(){
  if(currentUser){ const mine = state.profiles.find(p=>p.id===currentUser.id); if(mine) currentProfile = mine; }
  if(!hasAccess(currentView)) currentView = 'overview';
  renderSidebar();
  const map = {overview:renderOverview, applications:renderApplications, clients:renderClients, products:renderProducts, reports:renderReports, evaluation:renderEvaluation, docs:renderDocs, appraisals:renderAppraisals, approval:renderApproval, risk:renderRisk, branches:renderBranches, users:renderUsers, settings:renderSettings, help:renderHelp};
  document.getElementById('content').innerHTML = '';
  (map[currentView]||renderOverview)();
  const alerts = computeAlertsLocal();
  const myUnread = state.notifications.filter(n=>n.user_id===currentUser.id && !n.read);
  document.getElementById('alertDot').style.display = (alerts.length || myUnread.length) ? 'block' : 'none';
  wireBell();
}
function wireBell(){
  const bellBtn = document.getElementById('bellBtn');
  const panel = document.getElementById('notifPanel');
  if(bellBtn._wired) { renderNotifPanel(); return; }
  bellBtn._wired = true;
  bellBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    panel.classList.toggle('hidden');
    if(!panel.classList.contains('hidden')) renderNotifPanel();
  });
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target) && e.target!==bellBtn && !bellBtn.contains(e.target)) panel.classList.add('hidden');
  });
}
function renderNotifPanel(){
  const panel = document.getElementById('notifPanel');
  const mine = state.notifications.filter(n=>n.user_id===currentUser.id).slice(0,20);
  const unreadIds = mine.filter(n=>!n.read).map(n=>n.id);
  panel.innerHTML = `<div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
    <b style="font-size:13px;">Notifications</b>${unreadIds.length?`<button class="btn sm" id="notifMarkAll">Mark all read</button>`:''}</div>
    <div>${mine.length ? mine.map(n=>`<div class="notif-item" data-notif="${n.id}" data-app="${n.application_id||''}" style="padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:${n.read?'#fff':'var(--ok-bg)'};">
      <div style="font-size:12.5px;line-height:1.5;">${n.message}</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">${fmtDate(n.created_at)}</div>
    </div>`).join('') : `<div style="padding:20px 14px;color:var(--ink-soft);font-size:12.5px;">No notifications yet.</div>`}</div>`;
  const markAllBtn = document.getElementById('notifMarkAll');
  if(markAllBtn) markAllBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    await sb.from('notifications').update({read:true}).in('id', unreadIds);
    await fetchTable('notifications'); renderAll();
  });
  panel.querySelectorAll('[data-notif]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.dataset.notif;
    await sb.from('notifications').update({read:true}).eq('id', id);
    await fetchTable('notifications');
    if(hasAccess('evaluation')){ currentView='evaluation'; }
    document.getElementById('notifPanel').classList.add('hidden');
    renderAll();
  }));
}

/* Client-side mirror of v_risk_alerts, used for quick badges without a round trip */
function computeAlertsLocal(){
  const alerts = [];
  filteredApplications().forEach(a=>{
    if(['Approved','Differed','Disapproved'].includes(a.stage)) return;
    if(a.days_in_stage > (state.settings.sla_days||3)) alerts.push({priority:'High', text:a.applicant_name+' — SLA breached at '+a.stage, meta:branchName(a.branch_id)+' · '+a.days_in_stage+' days in stage · '+a.code, owner:a.officer||'Unassigned'});
  });
  return alerts;
}

function rowStageHTML(a){ const st=slaStatus(a.days_in_stage); return `<tr><td>${a.applicant_name}<div style="font-size:11px;color:var(--ink-soft)">${a.code}</div></td><td>${branchName(a.branch_id)}</td><td>${peso(a.amount)}</td><td>${stageTrack(a.stage,st)}</td><td><span class="badge ${st}">${a.days_in_stage}d</span></td></tr>`; }
function stageTrack(stage,status){
  if(TERMINAL_OUTCOMES.includes(stage)){
    const cls = stage==='Disapproved' ? 'risk' : 'warn';
    return '<span class="badge '+cls+'">'+stage+'</span>';
  }
  const idx=STAGES.indexOf(stage); let seg=''; for(let i=0;i<5;i++){ let cls='seg'+(i<=idx?' filled'+(i===idx&&status!=='ok'?' '+status:''):''); seg+='<div class="'+cls+'"></div>'; } return '<div class="stage-track">'+seg+'<span class="lbl">'+stage+'</span></div>';
}
function wireQuickActions(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const act = el.dataset.action;
      if(act==='newApp') return modalNewApplication();
      if(act==='newClient') return modalNewClient(true);
    });
  });
}

function renderApplications(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="page-head"><div><h1>Loan applications</h1><p>Create, review, and advance every loan request through the pipeline.</p></div><button class="btn primary" data-action="newApp">${ic('plus')} New application</button></div>

  <table><thead><tr><th>Applicant</th><th>Branch</th><th>Product</th><th>Amount</th><th>Stage</th><th>Days</th><th>Officer</th><th></th></tr></thead><tbody id="appTbody"></tbody></table></div>`;
  wireQuickActions();
  const draw = ()=>{
    const stage=document.getElementById('fStage').value, sla=document.getElementById('fSla').value, q=document.getElementById('fSearch').value.toLowerCase();
    let rows = filteredApplications();
    if(stage) rows = rows.filter(a=>a.stage===stage);
    if(sla) rows = rows.filter(a=>slaStatus(a.days_in_stage)===sla);
    if(q) rows = rows.filter(a=>(a.applicant_name+a.code).toLowerCase().includes(q));
    document.getElementById('appTbody').innerHTML = rows.length ? rows.map(a=>{
      const st = slaStatus(a.days_in_stage); const idx = STAGES.indexOf(a.stage); const nextIdx = idx+1;
      const canAdvance = idx>=0 && nextIdx<STAGES.length && a.stage!=='Approving Authority Review';
      const isTerminal = TERMINAL_OUTCOMES.includes(a.stage);
      
      // ← SECURED LOAN RULE: Check if blocked waiting for appraisal
      const isSecuredInEnrollment = a.security_type==='Secured' && a.stage==='Enrollment';
      const appraisalDone = isSecuredInEnrollment ? appraisalFor(a.id) && appraisalFor(a.id).recommendation!=='Deferred' : true;
      
      const actionCell = !appraisalDone ? `<button class="btn sm danger" style="cursor:not-allowed;opacity:0.6;">${ic('alert')} Appraise collateral first</button>` 
        : (canAdvance ? `<button class="btn sm" data-adv="${a.id}">Advance →</button>` 
        : (a.stage==='Approving Authority Review' ? `<span class="badge warn">Awaiting decision</span>` 
        : isTerminal ? `<span class="badge ${a.stage==='Disapproved'?'risk':'warn'}">${a.stage}</span>` 
        : `<span class="badge ok">Complete</span>`));
      
      const hasScore = !!scoreFor(a.id);
      return `<tr><td>${a.applicant_name}<div style="font-size:11px;color:var(--ink-soft)">${a.code}</div></td><td>${branchName(a.branch_id)}</td><td>${productName(a.product_id)}</td><td>${peso(a.amount)}</td><td>${stageTrack(a.stage,st)}</td><td><span class="badge ${st}">${a.days_in_stage}d</span></td><td>${a.officer||'—'}</td><td style="display:flex;gap:6px;flex-wrap:wrap;">${actionCell}<button class="btn sm" data-print="${a.id}">${ic('report')} Print CIF</button>${hasScore?`<button class="btn sm" data-printbcrrs="${a.id}">${ic('report')} Print BCRRS</button>`:''}${a.stage==='Approved'?`<button class="btn sm primary" data-printcp="${a.id}">${ic('report')} Print Credit Proposal</button>`:''}</td></tr>`;
    }).join('') : '<tr class="empty-row"><td colspan="8">No records match your search.</td></tr>';
    document.querySelectorAll('[data-adv]').forEach(b=>b.addEventListener('click', ()=>advanceStage(b.dataset.adv)));
    document.querySelectorAll('[data-print]').forEach(b=>b.addEventListener('click', ()=>printApplicationPackage(b.dataset.print)));
    document.querySelectorAll('[data-printbcrrs]').forEach(b=>b.addEventListener('click', ()=>printEvaluationReport(b.dataset.printbcrrs)));
    document.querySelectorAll('[data-printcp]').forEach(b=>b.addEventListener('click', ()=>printCreditProposal(b.dataset.printcp)));
  };
  ['fStage','fSla'].forEach(id=>document.getElementById(id).addEventListener('change',draw));
  document.getElementById('fSearch').addEventListener('input',draw);
  draw();
}
async function advanceStage(id){
  const a = state.applications.find(x=>x.id===id); if(!a) return;
  const idx = STAGES.indexOf(a.stage); if(idx>=STAGES.length-1) return;
  const nextStage = STAGES[idx+1];
  
  // ← SECURED LOAN RULE: Must complete collateral appraisal before Validation
  if(nextStage==='Validation' && a.security_type==='Secured'){
    const appr = appraisalFor(id);
    if(!appr || appr.recommendation==='Deferred'){
      showToast('Cannot proceed to Evaluation: Collateral appraisal must be completed first. Go to Collateral Appraisal module to appraise the collateral.');
      return;
    }
  }
  
  const {error} = await sb.from('applications').update({stage:nextStage, stage_entered_at:new Date().toISOString()}).eq('id', id);
  if(dbErr(error)) return;
  if(nextStage==='Validation' && docsFor(id).length===0){
    const reqDocs = requiredDocsFor(a.product_id, a.security_type, a.collateral_type);
    await sb.from('documents').insert(reqDocs.map(name=>({application_id:id, doc_name:name, category:'Standard'})));
  }
  showToast('Moved to '+nextStage);
  await fetchTable('applications'); await fetchTable('documents'); renderAll();
}

function cifRowVal(data,prefix,field){ return (data[prefix+field]||'').toString().trim(); }
function buildClientPayloadFromForm(data, prefix){
  const v = (f)=>cifRowVal(data,prefix,f);
  const fullName = [v('FirstName'), v('MiddleName'), v('LastName')].filter(Boolean).join(' ') + (v('Suffix')?' '+v('Suffix'):'');
  const personal_info = {
    title:v('Title'), last_name:v('LastName'), first_name:v('FirstName'), middle_name:v('MiddleName'), suffix:v('Suffix'), 
    nick_name:v('NickName'), citizenship:v('Citizenship'), birthdate:v('Birthdate')||null,
    birth_city:v('BirthCity'), birth_province:v('BirthProvince'),
    present_address:v('PresentAddress'), permanent_address:v('PermanentAddress')||v('PresentAddress'),
    preferred_mailing:v('PreferredMailing'), civil_status:v('CivilStatus'), tin:v('Tin'), sss_gsis:v('SssGsis'),
    mobile_phone:v('MobilePhone'), telephone:v('Telephone'), email:v('Email'),
    father:{last_name:v('FatherLastName'), first_name:v('FatherFirstName'), middle_name:v('FatherMiddleName'), birthdate:v('FatherBirthdate')||null},
    mother:{last_name:v('MotherLastName'), first_name:v('MotherFirstName'), middle_name:v('MotherMiddleName'), birthdate:v('MotherBirthdate')||null}
  };
  const financial_info = {
    employment_status:v('EmploymentStatus'), occupation:v('Occupation'), source_of_funds:v('SourceOfFunds'),
    annual_income:v('AnnualIncome'), account_purpose:v('AccountPurpose'),
    employer_name:v('EmployerName'), employer_address:v('EmployerAddress'), position:v('Position'), employed_since:v('EmployedSince')||null,
    business_name:v('BusinessName'), business_address:v('BusinessAddress'), nature_of_business:v('NatureOfBusiness'),
    politician_level:v('PoliticianLevel'), politician_position:v('PoliticianPosition'), date_elected:v('DateElected')||null,
    office_address:v('OfficeAddress'), politician_salary:v('PoliticianSalary')||null, years_as_politician:v('YearsAsPolitician')||null,
    farmer_hectares:v('FarmerHectares')||null, farmer_crops:v('FarmerCrops')
  };
  const spouse_info = {
    last_name:v('SpouseLastName'), first_name:v('SpouseFirstName'), middle_name:v('SpouseMiddleName'), nick_name:v('SpouseNickName'),
    birthdate:v('SpouseBirthdate')||null, citizenship:v('SpouseCitizenship'), education:v('SpouseEducation'),
    employment_status:v('SpouseEmploymentStatus'), tin:v('SpouseTin'), sss_gsis:v('SpouseSssGsis'),
    mobile_phone:v('SpouseMobilePhone'), telephone:v('SpouseTelephone'), email:v('SpouseEmail'),
    occupation:v('SpouseOccupation'), employer_or_business:v('SpouseEmployerOrBusiness'), work_address:v('SpouseWorkAddress'),
    position:v('SpousePosition'), employed_since:v('SpouseEmployedSince')||null, salary:v('SpouseSalary')||null
  };
  const dependents = [1,2,3].map(i=>({
    name:v('Dep'+i+'Name'), address:v('Dep'+i+'Address'), dob:v('Dep'+i+'Dob')||null, employment_status:v('Dep'+i+'EmpStatus'), relationship:v('Dep'+i+'Relationship')
  })).filter(d=>d.name);
  const bank_accounts = [1,2,3].map(i=>({
    bank_name:v('Bank'+i+'Name'), branch:v('Bank'+i+'Branch'), type:v('Bank'+i+'Type'), account_no:v('Bank'+i+'AcctNo'), date_opened:v('Bank'+i+'DateOpened')||null
  })).filter(b=>b.bank_name);
  const credit_cards = [1,2,3].map(i=>({
    company:v('Cc'+i+'Company'), issuer:v('Cc'+i+'Issuer'), limit:v('Cc'+i+'Limit')||null, number:v('Cc'+i+'Number'), expiry:v('Cc'+i+'Expiry')||null
  })).filter(c=>c.company);
  const other_info = {
    beneficiary:{ name:v('BeneficiaryName'), dob:v('BeneficiaryDob')||null, address:v('BeneficiaryAddress'), occupation:v('BeneficiaryOccupation'), birthplace:v('BeneficiaryBirthplace'), source_of_fund:v('BeneficiarySourceOfFund') },
    dependents, bank_accounts, credit_cards,
    co_maker:{
      last_name:v('CoMakerLastName'), first_name:v('CoMakerFirstName'), middle_name:v('CoMakerMiddleName'),
      relationship:v('CoMakerRelationship'), mobile_phone:v('CoMakerMobilePhone'), address:v('CoMakerAddress'),
      occupation:v('CoMakerOccupation'), monthly_income:v('CoMakerIncome')||null, id_ref:v('CoMakerIdRef')
    },
    misc:{
      pending_case: v('PendingCase')==='Yes', pending_case_details:v('PendingCaseDetails'),
      bank_closed: v('BankClosed')==='Yes', bank_closed_details:v('BankClosedDetails'),
      related_employee: v('RelatedEmployee')==='Yes', related_employee_name:v('RelatedEmployeeName'), related_employee_relationship:v('RelatedEmployeeRelationship')
    }
  };
  return { name: fullName, personal_info, financial_info, spouse_info, other_info, created_by: currentUser.id };
}
function wireSpouseToggle(prefix){
  const civilSelect = document.getElementById(prefix+'CivilStatusSelect');
  const spouseSection = document.getElementById(prefix+'SpouseSection');
  if(!civilSelect || !spouseSection) return;
  const toggle = ()=>{
    const isMarried = civilSelect.value === 'Married';
    spouseSection.style.display = isMarried ? '' : 'none';
    spouseSection.querySelectorAll('input,select').forEach(el=>{
      if(el.dataset.origRequired===undefined) el.dataset.origRequired = el.required ? '1' : '0';
      el.required = isMarried ? (el.dataset.origRequired==='1') : false;
      if(!isMarried) el.value = '';
    });
  };
  civilSelect.addEventListener('change', toggle);
  toggle();
}
function cifRequiredOk(data, prefix, isSecured){
  const v = (f)=>cifRowVal(data,prefix,f);
  const must = ['LastName','FirstName','Citizenship','Birthdate','BirthCity','BirthProvince','fPresentAddress','PreferredMailing','CivilStatus','MobilePhone','FatherLastName','FatherFirstName','MotherLastName','MotherFirstName','EmploymentStatus','Occupation','SourceOfFunds','AnnualIncome','AccountPurpose','PendingCase','BankClosed','RelatedEmployee'];
  // Co-maker is optional for secured loans, required for unsecured
  if(!isSecured){
    must.push('CoMakerLastName','CoMakerFirstName','CoMakerRelationship','CoMakerMobilePhone','CoMakerAddress');
  }
  return must.every(f=>v(f));
}

/* ============================================================
   NEW LOAN APPLICATION — client picker + full CIF form + loan details

function modalNewApplication(prefill){
  const bodyHTML = `
  <div class="form-section" style="margin-top:0;padding-top:0;border-top:none;">
    <h4><span class="num">1</span>Loan details</h4>
    <p style="font-size:13px;color:var(--ink);margin:0 0 12px;">Select your loan type, whether it's secured or unsecured, and the amount you're requesting.</p>
    <div class="field-row">
      <div class="field"><label>Loan product*</label><select name="loanType" id="napLoanType" required>${productOptions()}</select></div>
      <div class="field"><label>Loan security*</label><select name="securityType" id="napSecurityType" required><option value="">— Select —</option><option value="Unsecured">Unsecured</option><option value="Secured">Secured</option></select></div>
    </div>
    <div class="field"><label>Amount requested (₱)*</label><input name="amount" id="napAmount" type="number" min="1000" step="1000" required placeholder="50000"></div>
    <div id="napAmountNote" class="mini-note hidden" style="background:var(--warn-bg);border-radius:8px;padding:8px 12px;color:var(--warn-ink);">Unsecured loans are capped at ₱300,000.</div>
    <div id="napRequiredFieldsInfo" class="mini-note" style="background:#EAF0FB;border-radius:8px;padding:10px 12px;color:var(--ink);margin-top:12px;"></div>
  </div>

  <div class="form-section">
    <h4><span class="num">0</span>Applicant</h4>
    <div class="field"><label>Existing client (pick to skip the form below) — or leave as "new" to register a new applicant</label><select name="clientId" id="napClientSelect">${clientOptions(prefill&&prefill.clientId)}</select></div>
  </div>
  <div id="napNewApplicantFields">${cifFieldsHTML('nap', true)}</div>

  <div class="form-section">
    <h4><span class="num">5</span>Additional loan information</h4>
    <div class="field-row">
      <div class="field"><label>Branch*</label><select name="branch" required>${branchOptions()}</select></div>
      <div class="field"><label>Officer assigned</label><input name="officer" placeholder="e.g. J. Domingo"></div>
    </div>
    <div class="field"><label>Mode of payment*</label><select name="paymentMode" required>${cifOptions(['Monthly','Semi-Monthly','Quarterly','Semi-Annually','Lump Sum','Payroll Deduction'])}</select></div>
  </div>

  <div class="form-section">
    <h4><span class="num">6</span>Security &amp; documentary requirements</h4>
    <div class="field"><label>Upload requirements (Valid ID, 2x2 ID Picture, proof of membership, application form, and any product-specific documents — you can also add these later in Document Center)</label><input type="file" name="standardFiles" multiple></div>
    <div class="field"><label>Client Signature (optional)</label><input type="file" name="signatureFile" accept="image/*,.pdf"></div>
    <div id="napUnsecuredNote" class="mini-note" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;color:var(--ok-ink);">Unsecured loan — the checklist created in Document Center will require: Valid ID, 2x2 ID Picture, Proof of membership, Application form, plus any product-specific documents. No collateral upload needed.</div>
    <div id="napSecuredFields" class="hidden">
      <div class="field"><label>Collateral type*</label><select name="collateralType" id="napCollateralType"><option value="Real Estate Mortgage (REM)">Real Estate Mortgage (REM)</option><option value="Chattel Mortgage">Chattel Mortgage</option></select></div>
      <div class="field"><label>Upload collateral documents (title/OR-CR, tax declaration, appraisal, etc. — you can add more later in Document Center)</label><input type="file" name="collateralFiles" multiple></div>
      <div class="mini-note" style="background:#EAF0FB;border-radius:8px;padding:10px 12px;color:var(--blue);">Secured loan — the checklist will also require the collateral-specific documents for the type chosen above (e.g. TCT/Tax Declaration + Tax Clearance for REM, or OR/CR + Deed of Chattel Mortgage for Chattel), in addition to the standard requirements.</div>
    </div>
  </div>
  `;
  const close = openModal('New loan application', bodyHTML, async (data,close)=>{
    let clientId = data.clientId;
    const isSecured = data.securityType === 'Secured';
    if(!clientId){
      if(!cifRequiredOk(data,'nap', isSecured)){ showToast('Please complete all required (*) applicant fields'); return; }
      const payload = buildClientPayloadFromForm(data,'nap');
      const {data:cl,error} = await sb.from('clients').insert(payload).select().single();
      if(dbErr(error)) return; clientId = cl.id;
    }
    const applicant = clientName(clientId) !== '—' ? clientName(clientId) : (data.napFirstName ? [data.napFirstName,data.napLastName].join(' ') : 'Applicant');
    const securityType = data.securityType || 'Unsecured';
    const collateralType = securityType==='Secured' ? (data.collateralType||'Real Estate Mortgage (REM)') : null;
    if(securityType==='Unsecured' && Number(data.amount) > 300000){ showToast('Unsecured loans cannot exceed ₱300,000. Choose Secured for higher amounts.'); return; }
    const {data:app, error} = await sb.from('applications').insert({applicant_name:applicant, client_id:clientId, branch_id:data.branch, product_id:data.loanType, amount:Number(data.amount), officer:data.officer||'', payment_mode:data.paymentMode||'Monthly', security_type:securityType, collateral_type:collateralType, stage:'Enrollment', created_by:currentUser.id}).select().single();
    if(dbErr(error)) return;

    // auto-log the documentary requirements checklist for this application
    const reqDocs = requiredDocsFor(data.loanType, securityType, collateralType);
    await sb.from('documents').insert(reqDocs.map(name=>({application_id:app.id, doc_name:name, category:'Standard'})));
    if(securityType === 'Secured') {
      await ensureSecuredAppraisalEntry(app.id, collateralType);
    }

    // upload any standard requirement files attached at creation time
    const stdInput = document.querySelector('[name="standardFiles"]');
    if(stdInput && stdInput.files && stdInput.files.length){
      for(const file of stdInput.files){
        const up = await uploadFileToStorage('app-'+app.id, file);
        if(up.error){ showToast('File upload failed: '+up.error.message); continue; }
        await sb.from('documents').insert({application_id:app.id, doc_name:'Requirement file — '+up.name, category:'Standard', verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id, file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString()});
      }
    }

    const signatureInput = document.querySelector('[name="signatureFile"]');
    if(signatureInput && signatureInput.files && signatureInput.files.length){
      const file = signatureInput.files[0];
      const up = await uploadFileToStorage('app-'+app.id, file);
      if(up.error){ showToast('Signature upload failed: '+up.error.message); }
      else await sb.from('documents').insert({application_id:app.id, doc_name:'Client signature — '+up.name, category:'Standard', verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id, file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString()});
    }

    // upload any collateral files attached at creation time
    const fileInput = document.querySelector('[name="collateralFiles"]');
    if(securityType==='Secured' && fileInput && fileInput.files && fileInput.files.length){
      for(const file of fileInput.files){
        const up = await uploadFileToStorage('app-'+app.id, file);
        if(up.error){ showToast('File upload failed: '+up.error.message); continue; }
        await sb.from('documents').insert({application_id:app.id, doc_name:'Collateral file — '+up.name, category:'Collateral', verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id, file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString()});
      }
    }

    showToast('Application '+app.code+' created — document checklist logged'); close();
    await fetchTable('applications'); await fetchTable('clients'); await fetchTable('documents'); await fetchTable('appraisals'); currentView='applications'; renderAll();
  }, 'Create application', true);
  setTimeout(()=>{
    const sel = document.getElementById('napClientSelect');
    const fieldsWrap = document.getElementById('napNewApplicantFields');
    const toggle = ()=>{
      const isExisting = !!sel.value;
      fieldsWrap.style.display = isExisting ? 'none' : '';
      fieldsWrap.querySelectorAll('input,select').forEach(el=>{
        if(el.dataset.origRequired===undefined) el.dataset.origRequired = el.required ? '1' : '0';
        el.required = isExisting ? false : (el.dataset.origRequired==='1');
      });
    };
    sel.addEventListener('change', toggle);
    toggle();
    wireSpouseToggle('nap');

    // Handle security type changes
    const secSel = document.getElementById('napSecurityType');
    const securedFields = document.getElementById('napSecuredFields');
    const unsecuredNote = document.getElementById('napUnsecuredNote');
    const amountInput = document.getElementById('napAmount');
    const amountNote = document.getElementById('napAmountNote');
    const coMakerFields = document.getElementById('napCoMakerFields');
    const coMakerLastName = document.getElementById('napCoMakerLastNameInput');
    const coMakerFirstName = document.getElementById('napCoMakerFirstNameInput');
    const coMakerRelationship = document.getElementById('napCoMakerRelationshipInput');
    const coMakerMobilePhone = document.getElementById('napCoMakerMobilePhoneInput');
    const coMakerAddress = document.getElementById('napCoMakerAddressInput');
    const requiredFieldsInfo = document.getElementById('napRequiredFieldsInfo');

    const loanTypeSelect = document.getElementById('napLoanType');
    
    const updateFormState = ()=>{
      const secured = secSel.value === 'Secured';
      securedFields.classList.toggle('hidden', !secured);
      unsecuredNote.classList.toggle('hidden', secured);
      
      // Hide co-maker section entirely for secured loans
      const coMakerSection = document.querySelector('[id*="CoMakerInformation"]')?.closest('.form-section') || 
                             Array.from(document.querySelectorAll('.form-section')).find(s => s.textContent.includes('Co-maker'));
      if(coMakerSection){
        coMakerSection.classList.toggle('hidden', secured);
      }
      
      // Update co-maker requirement based on security type
      if(secured){
        // For secured loans, co-maker is hidden and optional
        coMakerLastName.removeAttribute('required');
        coMakerFirstName.removeAttribute('required');
        coMakerRelationship.removeAttribute('required');
        coMakerMobilePhone.removeAttribute('required');
        coMakerAddress.removeAttribute('required');
      } else {
        // For unsecured loans, co-maker is visible and required
        coMakerLastName.setAttribute('required', 'required');
        coMakerFirstName.setAttribute('required', 'required');
        coMakerRelationship.setAttribute('required', 'required');
        coMakerMobilePhone.setAttribute('required', 'required');
        coMakerAddress.setAttribute('required', 'required');
      }
      
      // Update amount limits
      if(secured){ 
        amountInput.removeAttribute('max'); 
        amountNote.classList.add('hidden'); 
      } else { 
        amountInput.setAttribute('max','300000'); 
        amountNote.classList.remove('hidden'); 
      }

      // Update required fields info
      updateRequiredFieldsInfo(secured);
    };

    const updateRequiredFieldsInfo = (isSecured)=>{
      let info = '<strong>Information to be filled:</strong><br>';
      info += '✓ Applicant details (personal & financial information)<br>';
      info += '✓ Employment and income details<br>';
      if(isSecured){
        info += '✓ Collateral details and documentation<br>';
      } else {
        info += '✓ Co-maker information (required — must have joint liability)<br>';
      }
      info += '✓ Loan documents and requirements';
      requiredFieldsInfo.innerHTML = info;
    };

    secSel.addEventListener('change', updateFormState);
    loanTypeSelect.addEventListener('change', updateFormState);
    
    updateFormState();
  },0);
}

function modalViewCIF(clientId){

      row('Employment status',si.employment_status)+row('Mobile phone',si.mobile_phone)

  }

    <div class="mini-note">Beneficiary</div>${grid(row('Name',beneficiary.name)+row('Relationship / occupation',beneficiary.occupation))}

    ${bankAccts.length?`<div class="mini-note">Bank accounts</div><table class="mini-table"><thead><tr><th>Bank</th><th>Type</th><th>Account no.</th></tr></thead><tbody>${bankAccts.map(b=>`<tr><td>${b.bank_name}</td><td>${b.type||'—'}</td><td>${b.account_no||'—'}</td></tr>`).join('')}</tbody></table>`:''}
    ${cards.length?`<div class="mini-note">Credit cards</div><table class="mini-table"><thead><tr><th>Company</th><th>Issuer</th><th>Limit</th></tr></thead><tbody>${cards.map(cc=>`<tr><td>${cc.company}</td><td>${cc.issuer||'—'}</td><td>${cc.limit?peso(cc.limit):'—'}</td></tr>`).join('')}</tbody></table>`:''}

      row('Name',[coMaker.first_name,coMaker.middle_name,coMaker.last_name].filter(Boolean).join(' '))+
      row('Relationship',coMaker.relationship)+row('Mobile phone',coMaker.mobile_phone)+
      row('Address',coMaker.address)+row('Occupation',coMaker.occupation)+

  const close = openModal('Client Information Form — '+cl.name, body, (d,close)=>close(), 'Close', true);

function modalNewClient(andApp){

  <div class="report-grid">${cards.map(card=>`<div class="report-card"><div class="ic">${ic('report')}</div><h3>${card.title}</h3><p>${card.desc}</p><a href="#" data-report="${card.id}">${ic('download')} Generate report (.csv)</a></div>`).join('')}</div>`;

function generateReport(type){
  const apps = filteredApplications();
  if(type==='portfolio') downloadCSV('portfolio-summary.csv', [['Application','Applicant','Branch','Stage','Amount'], ...apps.map(a=>[a.code,a.applicant_name,branchName(a.branch_id),a.stage,a.amount])]);
  else if(type==='pipeline') downloadCSV('application-pipeline.csv', [['Stage','Count'], ...STAGES.map(s=>[s, apps.filter(a=>a.stage===s).length])]);
  else if(type==='officer'){ const byOfficer={}; apps.forEach(a=>{ const o=a.officer||'Unassigned'; byOfficer[o]=(byOfficer[o]||0)+1; }); downloadCSV('loan-officer-performance.csv', [['Officer','Applications handled'], ...Object.entries(byOfficer)]); }
  else if(type==='demographics') downloadCSV('client-demographics.csv', [['Client','Employment status','Civil status'], ...state.clients.map(cl=>[cl.name,(cl.financial_info||{}).employment_status,(cl.personal_info||{}).civil_status])]);
  else if(type.startsWith('listing-')){
    const outcome = {'listing-approved':'Approved','listing-differed':'Differed','listing-disapproved':'Disapproved'}[type];
    const list = apps.filter(a=>a.stage===outcome);
    downloadCSV('listing-'+outcome.toLowerCase()+'.csv', [['Application','Applicant','Branch','Product','Amount','Decision date','Remarks'], ...list.map(a=>[a.code,a.applicant_name,branchName(a.branch_id),productName(a.product_id),a.amount,fmtDate(a.stage_entered_at),a.decision_remarks||''])]);
  }
  showToast('Report downloaded');
}

function renderEvaluation(){
  const isManager = currentProfile && ['Administrator','Branch Manager'].includes(currentProfile.role);
  let rows = filteredApplications().filter(a=>['Validation','Endorsement'].includes(a.stage) || scoreFor(a.id));
  if(!isManager && currentProfile){
    rows = rows.filter(a=>{ const ev=evalFor(a.id); return !ev || (ev.assigned_to||'').trim().toLowerCase()===(currentProfile.full_name||'').trim().toLowerCase(); });
  }
  const c = document.getElementById('content');
  const attention = rows.filter(a=>{const s=scoreFor(a.id); return s&&['SUBSTANDARD','DOUBTFUL','LOSS'].includes(s.decision);}).length;
  c.innerHTML = `<div class="page-head"><div><div class="eyebrow">Client validation & CIBI${isManager?'':' — your assigned cases'}</div><h1>Validation (CIBI)</h1><p>Assign each enrolled client to an Evaluation Staff for Credit Investigation & Background Investigation, run the BCRRS scorecard and cash-flow check, generate the evaluation report, then endorse to the Approving Authority — all in one place.${isManager?'':' You only see cases assigned to you (plus unassigned ones).'}</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn primary" data-action="assignEval">${ic('plus')} Assign evaluator</button><button class="btn primary" data-action="runScorecard">${ic('plus')} Run BCRRS scorecard</button></div></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;"><div class="kpi"><div class="lbl">Work queue</div><div class="val">${rows.length}</div></div><div class="kpi"><div class="lbl">Requires attention</div><div class="val">${attention}</div></div><div class="kpi"><div class="lbl">Performance</div><div class="val">${rows.length?Math.round(((rows.length-attention)/rows.length)*100):100}%</div></div></div>
  <div class="panel"><div class="panel-head"><h2>Validation & CIBI queue</h2></div><p class="sub">Live across ${branchFilter?branchName(branchFilter):'all branches'}.</p>
  <table><thead><tr><th>Application</th><th>Applicant</th><th>Evaluation Staff</th><th>BCRRS score</th><th>Risk classification</th><th>DBR</th><th>Max loan</th><th>Assessment</th><th></th></tr></thead>
  <tbody>${rows.length ? rows.map(a=>{
    const st=slaStatus(a.days_in_stage); const ev=evalFor(a.id); const s=scoreFor(a.id); const band=s?bcrrsBandFor(Number(s.score)):null;
    const canEndorse = s && a.stage==='Endorsement';
    return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td>${ev?ev.assigned_to:'<span class="badge neutral">Unassigned</span>'}</td><td>${s?Number(s.score).toFixed(2):'—'}</td><td>${band?'<span class="badge '+band.cls+'">'+band.label+'</span>':'<span class="badge neutral">Not scored</span>'}</td><td>${s?s.dti+'%':'—'}</td><td>${s&&s.max_loan_amount!=null?peso(s.max_loan_amount):'—'}</td><td>${s?s.decision:'—'}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn sm" data-assign="${a.id}">Assign</button>${a.stage==='Validation'?`<button class="btn sm" data-adv2="${a.id}">Advance →</button>`:''}${s?`<button class="btn sm" data-report="${a.id}">${ic('report')} Report</button><button class="btn sm" data-editscore="${a.id}">Edit</button>`:''}${canEndorse?`<button class="btn sm primary" data-endorse="${a.id}">Assign to Approving Authority →</button>`:''}</td></tr>`;
  }).join('') : '<tr class="empty-row"><td colspan="9">No records match your search.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="assignEval"]').addEventListener('click',()=>modalAssignEvaluator());
  document.querySelector('[data-action="runScorecard"]').addEventListener('click',modalRunScorecard);
  c.querySelectorAll('[data-assign]').forEach(b=>b.addEventListener('click',()=>modalAssignEvaluator(b.dataset.assign)));
  c.querySelectorAll('[data-adv2]').forEach(b=>b.addEventListener('click',()=>advanceStage(b.dataset.adv2)));
  c.querySelectorAll('[data-report]').forEach(b=>b.addEventListener('click',()=>printEvaluationReport(b.dataset.report)));
  c.querySelectorAll('[data-editscore]').forEach(b=>b.addEventListener('click',()=>modalRunScorecard(b.dataset.editscore)));
  c.querySelectorAll('[data-endorse]').forEach(b=>b.addEventListener('click',()=>modalAssignApprovingAuthority(b.dataset.endorse)));
}
function modalAssignApprovingAuthority(appId){
  const a = state.applications.find(x=>x.id===appId); if(!a) return;
  const eligible = state.profiles; // any registered/signed-in staff member can be picked
  if(!eligible.length){
    openModal('Assign to Approving Authority', `<p style="color:var(--ink-soft);font-size:13px;">No staff have signed in yet, so there's no one to assign. Have the intended approver sign in once, then try again.</p>`, (d,close)=>close(), 'Close');
    return;
  }
  const optionsHTML = eligible.map(p=>{
    const overLimit = p.approval_limit!=null && Number(a.amount) > Number(p.approval_limit);
    const limitLabel = p.approval_limit!=null ? 'up to '+peso(p.approval_limit) : (p.is_approving_authority ? 'no limit' : 'no limit set');
    return `<option value="${p.id}" data-name="${esc(p.full_name)}" ${overLimit?'disabled':''}>${esc(p.full_name)} (${esc(p.role)}) — ${limitLabel}${overLimit?' — exceeds this amount':''}</option>`;
  }).join('');
  openModal('Assign to Approving Authority', `
    <div class="mini-note" style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;">${a.code} — ${a.applicant_name} — ${peso(a.amount)}</div>
    <div class="field"><label>Approving Authority*</label><select name="approverId" id="aaSelect" required><option value="">— select —</option>${optionsHTML}</select></div>
    <div class="mini-note">Anyone who has signed in can be picked. Approvers whose approval limit (set by an Administrator under Users &amp; roles) is below this loan's amount are grayed out and can't be selected.</div>
  `, async (data,close)=>{
    const approver = eligible.find(p=>p.id===data.approverId);
    if(!approver){ showToast('Select an Approving Authority'); return; }
    const {error} = await sb.from('applications').update({stage:'Approving Authority Review', stage_entered_at:new Date().toISOString(), approving_authority_id:approver.id, approving_authority_name:approver.full_name}).eq('id', appId);
    if(dbErr(error)) return;
    await notifyUserByName(approver.full_name, 'A case has been endorsed to you for approval — '+a.code+' ('+a.applicant_name+', '+peso(a.amount)+'). Open Approving Authority to review.', appId);
    showToast('Endorsed to '+approver.full_name); close();
    await fetchTable('applications'); await fetchTable('notifications'); renderAll();
  }, 'Assign & endorse');
}
function modalAssignEvaluator(appId){
  const pool = filteredApplications().filter(a=>['Validation','Endorsement'].includes(a.stage));
  const staffOptions = state.profiles.map(p=>'<option value="'+esc(p.full_name)+'">'+esc(p.full_name)+' ('+esc(p.role)+')</option>').join('');
  openModal('Assign to Evaluation Staff (CIBI)', `<div class="field"><label>Application</label><select name="appId">${appOptions(pool, appId)}</select></div>
  <div class="field"><label>Evaluation Staff</label><select name="assignedTo" required><option value="">— select staff —</option>${staffOptions}</select></div>
  <div class="mini-note">Only staff who have signed in at least once appear here — picking one sends them a notification that they have a pending CIBI case. <b style="color:var(--ink-soft);">For Secured loans, the collateral must be appraised before assigning to evaluation.</b></div>`, async (data,close)=>{
    const a = state.applications.find(x=>x.id===data.appId);
    
    // ← SECURED LOAN RULE: Must complete collateral appraisal before assigning to Validation/Evaluation
    if(a && a.security_type==='Secured'){
      const appr = appraisalFor(data.appId);
      if(!appr || appr.recommendation==='Deferred'){
        showToast('Cannot assign: Collateral appraisal must be completed first. Go to Collateral Appraisal module to appraise the collateral.');
        return;
      }
    }
    
    const {error} = await sb.from('evaluations').insert({application_id:data.appId, assigned_to:data.assignedTo});
    if(dbErr(error)) return;
    if(a && a.stage==='Enrollment') await sb.from('applications').update({stage:'Validation', stage_entered_at:new Date().toISOString()}).eq('id', data.appId);
    await notifyUserByName(data.assignedTo, 'You have a pending CIBI assignment — '+(a?a.code+' ('+a.applicant_name+')':'an application')+'. Open Validation (CIBI) to begin.', data.appId);
    showToast('Assigned for CIBI — '+data.assignedTo+' notified'); close(); await fetchTable('evaluations'); await fetchTable('applications'); await fetchTable('notifications'); renderAll();
  }, 'Assign');
}

function bcrrsCategoriesFor(purpose){
  const cond = CONDITION_VARIANTS[purpose] || CONDITION_VARIANTS['Agricultural'];
  return [
    ['CHARACTER', BCRRS_FIXED.CHARACTER[0], BCRRS_FIXED.CHARACTER[1]],
    ['CAPACITY', BCRRS_FIXED.CAPACITY[0], BCRRS_FIXED.CAPACITY[1]],
    ['COLLATERAL', BCRRS_FIXED.COLLATERAL[0], BCRRS_FIXED.COLLATERAL[1]],
    ['CONDITION OF PROJECT', 0.20, cond],
    ['CAPITAL', BCRRS_FIXED.CAPITAL[0], BCRRS_FIXED.CAPITAL[1]],
  ];
}
function modalRunScorecard(prefillAppId){
  const pool = filteredApplications();
  if(!pool.length){ openModal('Run scorecard', '<p style="color:var(--ink-soft);font-size:13px;">No applications exist yet — enroll a client first.</p>', (d,close)=>close(), 'Close'); return; }
  const existing = prefillAppId ? scoreFor(prefillAppId) : null;
  const isEdit = !!existing;
  const cf0 = (existing && existing.cashflow) || {};
  const fs0 = (existing && existing.factor_scores) || {};
  const ov0 = (existing && existing.category_overrides) || {};
  const purpose0 = (existing && existing.loan_purpose) || LOAN_PURPOSES[0];
  renderScorecardModal(prefillAppId, isEdit, cf0, fs0, ov0, purpose0);
}
function renderScorecardModal(prefillAppId, isEdit, cf0, fs0, ov0, purpose){
  const pool = filteredApplications();
  let bodyHTML = `<div class="field"><label>Pick a client / application*</label><select name="appId" id="scAppId" required ${isEdit?'disabled':''}>${appOptions(pool, prefillAppId)}</select></div>${isEdit?`<input type="hidden" name="appId" value="${prefillAppId}">`:''}`;
  bodyHTML += `<div class="field"><label>Purpose of loan* <span style="font-weight:400;color:var(--ink-soft);">(determines the Condition of Project factors below)</span></label><select name="loanPurpose" id="scPurpose">${LOAN_PURPOSES.map(p=>`<option value="${esc(p)}" ${p===purpose?'selected':''}>${p}</option>`).join('')}</select></div>`;
  bodyHTML += `<div class="form-section"><h4><span class="num">1</span>Cash flow & debt capacity (monthly, ₱)</h4>
    <div class="field-row3"><div class="field"><label>Salary / wages (net)</label><input name="cfSalary" type="number" step="0.01" value="${cf0.salary||0}"></div><div class="field"><label>Business income (net)</label><input name="cfBusiness" type="number" step="0.01" value="${cf0.business_income||0}"></div><div class="field"><label>Other income</label><input name="cfOther" type="number" step="0.01" value="${cf0.other_income||0}"></div></div>
    <div class="field-row3"><div class="field"><label>Food & groceries</label><input name="cfFood" type="number" step="0.01" value="${cf0.food_groceries||0}"></div><div class="field"><label>Utilities</label><input name="cfUtilities" type="number" step="0.01" value="${cf0.utilities||0}"></div><div class="field"><label>Transportation</label><input name="cfTransport" type="number" step="0.01" value="${cf0.transportation||0}"></div></div>
    <div class="field-row3"><div class="field"><label>Education / allowance</label><input name="cfEducation" type="number" step="0.01" value="${cf0.education||0}"></div><div class="field"><label>Existing loan amortization</label><input name="cfExisting" type="number" step="0.01" value="${cf0.existing_loan||0}"></div><div class="field"><label>Other household expenses</label><input name="cfOtherHH" type="number" step="0.01" value="${cf0.other_household||0}"></div></div>
    <div id="cfLive" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.7;"></div>
  </div>`;
  const catKeys = ['character','capacity','collateral','condition','capital'];
  bcrrsCategoriesFor(purpose).forEach(([catName,weight,factors],ci)=>{
    const catKey = catKeys[ci];
    const ovVal = ov0[catKey];
    bodyHTML += `<div class="form-section"><h4><span class="num">${ci+2}</span>${catName} <span style="font-weight:400;text-transform:none;color:var(--ink-soft);">(weight ${Math.round(weight*100)}%)</span></h4>`;
    bodyHTML += `<div class="field"><label>Manual category score override (0-10, optional) <span style="font-weight:400;color:var(--ink-soft);">— fills in a direct score instead of averaging the factors below</span></label><input type="number" min="0" max="10" step="0.01" name="ov_${catKey}" value="${ovVal!=null?ovVal:''}" placeholder="Leave blank to compute from factors"></div>`;
    factors.forEach(([num,fname,options])=>{
      const sel = fs0[num]!=null ? Number(fs0[num]) : null;
      bodyHTML += `<div class="field"><label>${num}. ${fname}</label><select name="f${num}" data-factor="${num}">${options.map(([text,score])=>`<option value="${score}" ${sel===score?'selected':''}>${text} (${score})</option>`).join('')}</select></div>`;
    });
    bodyHTML += `</div>`;
  });
  const close = openModal(isEdit?'Edit BCRRS scorecard & cash flow':'Run BCRRS scorecard & cash flow', bodyHTML, async (data,close)=>{
    const factor_scores = {};
    bcrrsCategoriesFor(data.loanPurpose).forEach(([,,factors])=>factors.forEach(([num])=>{ factor_scores[num]=Number(data['f'+num]||0); }));
    const category_overrides = {};
    catKeys.forEach(k=>{ if(data['ov_'+k]!==undefined && data['ov_'+k]!=='') category_overrides[k]=Number(data['ov_'+k]); });
    const cashflow = {salary:Number(data.cfSalary||0),business_income:Number(data.cfBusiness||0),other_income:Number(data.cfOther||0),
      food_groceries:Number(data.cfFood||0),utilities:Number(data.cfUtilities||0),transportation:Number(data.cfTransport||0),
      education:Number(data.cfEducation||0),existing_loan:Number(data.cfExisting||0),other_household:Number(data.cfOtherHH||0)};
    const {data:result, error} = await sb.rpc('run_credit_scorecard', {p_application_id:data.appId, p_factor_scores:factor_scores, p_cashflow:cashflow, p_loan_purpose:data.loanPurpose, p_category_overrides:category_overrides});
    if(dbErr(error)) return;
    const r = result[0];
    // move the application into Endorsement once it's been scored, so it's ready to be endorsed to the Approving Authority
    const a = state.applications.find(x=>x.id===data.appId);
    if(a && (a.stage==='Enrollment' || a.stage==='Validation')) await sb.from('applications').update({stage:'Endorsement', stage_entered_at:new Date().toISOString()}).eq('id', data.appId);
    showToast((isEdit?'Scorecard updated — ':'Scorecard generated — ')+Number(r.score).toFixed(2)+' ('+r.risk_band+', '+r.decision+')'); close();
    await fetchTable('creditScores'); await fetchTable('applications'); renderAll();
  }, isEdit?'Save changes':'Run scorecard', true);
  setTimeout(()=>{
    document.getElementById('scPurpose').addEventListener('change', (e)=>{
      // gather whatever cash-flow + override values are currently entered so switching purpose doesn't lose them
      const liveCf = {
        salary:document.querySelector('[name="cfSalary"]').value, business_income:document.querySelector('[name="cfBusiness"]').value, other_income:document.querySelector('[name="cfOther"]').value,
        food_groceries:document.querySelector('[name="cfFood"]').value, utilities:document.querySelector('[name="cfUtilities"]').value, transportation:document.querySelector('[name="cfTransport"]').value,
        education:document.querySelector('[name="cfEducation"]').value, existing_loan:document.querySelector('[name="cfExisting"]').value, other_household:document.querySelector('[name="cfOtherHH"]').value
      };
      document.getElementById('modalRoot').innerHTML = '';
      renderScorecardModal(prefillAppId, isEdit, liveCf, fs0, ov0, e.target.value);
    });
    const liveEl = document.getElementById('cfLive');
    const ids = ['cfSalary','cfBusiness','cfOther','cfFood','cfUtilities','cfTransport','cfEducation','cfExisting','cfOtherHH'];
    const recalc = ()=>{
      const v = id=>Number(document.querySelector(`[name="${id}"]`).value||0);
      const income = v('cfSalary')+v('cfBusiness')+v('cfOther');
      const subtotal = v('cfExisting')+v('cfFood')+v('cfUtilities')+v('cfTransport')+v('cfEducation')+v('cfOtherHH');
      const expenses = subtotal*1.2;
      const ndi = income-expenses;
      const dbr = ndi>0 ? (v('cfExisting')/ndi*100) : 0;
      liveEl.innerHTML = `Total income: <b>${peso(income)}</b> &nbsp;·&nbsp; Total expenses (incl. 20% buffer): <b>${peso(expenses)}</b><br>Net Disposable Income: <b>${peso(ndi)}</b> &nbsp;·&nbsp; Debt Burden Ratio: <b>${dbr.toFixed(1)}%</b>`;
    };
    ids.forEach(id=>document.querySelector(`[name="${id}"]`).addEventListener('input',recalc));
    recalc();
  },0);
}

  openModal('Document checklist', '<div class="field"><label>Application</label><select id="dcApp">'+appOptions(pool,id)+'</select></div>'+secBadge+listHTML, (data,close)=>close(), 'Close', true);
  document.getElementById('dcApp').addEventListener('change', e=>{ document.getElementById('modalRoot').innerHTML=''; modalChecklist(e.target.value); });
  document.querySelectorAll('#dcList [data-doc]').forEach(cb=>cb.addEventListener('change', async e=>{
    const {error} = await sb.from('documents').update({verified:e.target.checked, verified_at:e.target.checked?new Date().toISOString():null, verified_by:e.target.checked?currentUser.id:null}).eq('id', e.target.dataset.doc);
    if(dbErr(error)) return;
    await fetchTable('documents'); renderAll();
  }));
  document.querySelectorAll('#dcList [data-upload]').forEach(inp=>inp.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const docId = e.target.dataset.upload;
    const up = await uploadFileToStorage('app-'+id, file);
    if(up.error){ showToast('Upload failed: '+up.error.message); return; }
    const {error} = await sb.from('documents').update({file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString(), verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id}).eq('id', docId);
    if(dbErr(error)) return;
    showToast('File uploaded'); await fetchTable('documents'); document.getElementById('modalRoot').innerHTML=''; modalChecklist(id); renderAll();
  }));
}
