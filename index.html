<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBC Loan Monitoring — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --sidebar:#0F2C27; --sidebar-hover:#173B34; --sidebar-active:#1E4B42;
  --sidebar-text:#A9BEB8; --sidebar-text-dim:#6E8580;
  --accent:#12A594; --accent-dark:#0C8377;
  --blue:#2451D6;
  --bg:#F5F6F4; --card:#FFFFFF; --border:#E4E7E3;
  --ink:#16231F; --ink-soft:#68746E;
  --warn-bg:#FBF0D9; --warn-ink:#8A6A12;
  --risk-bg:#FBE4E1; --risk-ink:#C13B2C;
  --ok-bg:#E1F3EE; --ok-ink:#0C8377;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:260px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 14px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.sidebar-brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:14px;flex-shrink:0;}
.sidebar-brand .name{color:#fff;font-weight:700;font-size:15px;line-height:1.2;}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#8FD6C8;margin:0 4px 14px;}
.live-pill .dot{width:6px;height:6px;border-radius:50%;background:#3FD69A;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.branch-box{margin:0 4px 16px;}
.branch-box label{font-size:10.5px;letter-spacing:.05em;color:var(--sidebar-text-dim);text-transform:uppercase;display:block;margin-bottom:6px;}
.branch-box select{width:100%;background:var(--sidebar-hover);border:1px solid #24463F;color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;}
.nav-group{margin-bottom:6px;}
.nav-group-label{font-size:10.5px;letter-spacing:.06em;color:var(--sidebar-text-dim);text-transform:uppercase;padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--sidebar-text);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid #1B3D36;display:flex;align-items:center;gap:10px;padding-left:8px;}
.sidebar-footer .av{width:32px;height:32px;border-radius:50%;background:#E7A96B;color:#3A2708;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.sidebar-footer .who b{display:block;color:#fff;font-size:13px;}
.sidebar-footer .who span{font-size:11.5px;color:var(--sidebar-text-dim);}
.sidebar-footer .signout{margin-left:auto;background:none;border:none;color:var(--sidebar-text-dim);font-size:11.5px;text-decoration:underline;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:20px 32px 0;}
.topbar .bell{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;position:relative;color:var(--ink-soft);}
.topbar .bell .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--risk-ink);}
.topbar .av{width:34px;height:34px;border-radius:50%;background:#8FD6C8;color:#0C4B41;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;}
.content{padding:18px 32px 60px;}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-head h1{font-size:26px;color:var(--blue);font-weight:700;}
.page-head p{margin:6px 0 0;color:var(--ink-soft);font-size:13px;}
.greeting h1{color:var(--ink);}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;border-radius:8px;padding:10px 16px;border:1px solid var(--border);background:#fff;color:var(--ink);white-space:nowrap;}
.btn svg{width:15px;height:15px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-dark);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.danger{color:var(--risk-ink);}
.btn:disabled{opacity:.55;cursor:default;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.kpi .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.kpi .ic svg{width:17px;height:17px;}
.kpi .lbl{font-size:12.5px;color:var(--ink-soft);}
.kpi .val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:2px;}
.kpi .delta{font-size:11.5px;margin-top:5px;color:var(--ink-soft);}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.panel h2{font-size:16px;color:var(--blue);}
.panel .sub{color:var(--ink-soft);font-size:12.5px;margin:2px 0 16px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between;}
.filter-row .left{display:flex;gap:8px;flex-wrap:wrap;}
.filter-row select,.filter-row input[type=text]{border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:12.5px;background:#fff;color:var(--ink);}
.search-box{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:7px;padding:7px 11px;background:#fff;}
.search-box svg{width:15px;height:15px;color:var(--ink-soft);}
.search-box input{border:none;outline:none;font-size:12.5px;width:150px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);border-bottom:1px solid var(--border);padding:9px 10px;font-weight:600;}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFBF9;}
.empty-row td{text-align:center;color:var(--ink-soft);padding:34px 10px;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink);}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink);}
.badge.risk{background:var(--risk-bg);color:var(--risk-ink);}
.badge.neutral{background:#EFEFEC;color:var(--ink-soft);}
.alert-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.alert-item:last-child{border-bottom:none;}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.alert-dot.risk{background:var(--risk-ink);}
.alert-dot.warn{background:#C68A2E;}
.alert-item .txt strong{font-weight:600;}
.alert-item .meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.report-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:#fff;}
.report-card .ic{width:30px;height:30px;border-radius:8px;background:var(--ok-bg);color:var(--ok-ink);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.report-card h3{font-size:14.5px;color:var(--blue);margin-bottom:4px;}
.report-card p{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
.report-card a{font-size:12.5px;font-weight:600;color:var(--accent-dark);display:inline-flex;align-items:center;gap:4px;}
.tabbed{display:grid;grid-template-columns:220px 1fr;gap:18px;}
.tablist{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:8px;height:fit-content;}
.tablist button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;border:none;background:none;font-size:13px;color:var(--ink-soft);font-weight:500;margin-bottom:2px;}
.tablist button.active{background:var(--ok-bg);color:var(--ok-ink);font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:13px;color:var(--ink);background:#fff;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
.toggle-row .t{font-size:13px;font-weight:500;}
.toggle-row .d{font-size:11.5px;color:var(--ink-soft);}
.switch{width:38px;height:22px;border-radius:999px;background:#D8DCD8;position:relative;flex-shrink:0;border:none;padding:0;}
.switch.on{background:var(--accent);}
.switch .knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
.switch.on .knob{left:19px;}
.stage-track{display:flex;align-items:center;gap:3px;}
.stage-track .seg{width:14px;height:6px;border-radius:3px;background:#E4E7E3;}
.stage-track .seg.filled{background:var(--accent);}
.stage-track .seg.filled.warn{background:#C68A2E;}
.stage-track .seg.filled.risk{background:var(--risk-ink);}
.stage-track .lbl{font-size:11px;color:var(--ink-soft);margin-left:7px;white-space:nowrap;}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.help-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:#fff;}
.help-card h3{font-size:14.5px;color:var(--blue);margin-bottom:8px;}
.help-card ol,.help-card ul{margin:0;padding-left:18px;color:var(--ink-soft);font-size:13px;line-height:1.8;}
.bars{display:flex;align-items:flex-end;gap:16px;height:160px;padding:10px 0;}
.bars .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;}
.bars .barcol .stack{width:70%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;}
.bars .barcol .seg{width:100%;}
.bars .barcol .lbl{font-size:11px;color:var(--ink-soft);text-align:center;}
.overlay{position:fixed;inset:0;background:rgba(15,25,22,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal.wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-head button{background:none;border:none;color:var(--ink-soft);width:26px;height:26px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;position:sticky;bottom:-24px;background:#fff;padding:14px 0 2px;}
.form-section{border-top:1px solid var(--border);margin-top:18px;padding-top:16px;}
.form-section:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.form-section h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-dark);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.form-section h4 .num{width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok-ink);display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.field-row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.mini-note{font-size:11.5px;color:var(--ink-soft);margin:-6px 0 10px;}
.mini-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
.mini-table th{font-size:10px;padding:5px 4px;background:#FAFBF9;border-bottom:1px solid var(--border);}
.mini-table td{padding:4px;border-bottom:none;}
.mini-table input{width:100%;border:1px solid var(--border);border-radius:5px;padding:6px 7px;font-size:12px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all .2s;max-width:320px;}
.toast.show{opacity:1;transform:translateY(0);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar);}
.login-card{background:#fff;border-radius:14px;padding:36px 32px;width:100%;max-width:380px;}
.login-card .mark{width:44px;height:44px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-bottom:16px;}
.login-card h2{font-size:20px;margin-bottom:4px;}
.login-card p{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.login-err{background:var(--risk-bg);color:var(--risk-ink);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D5D9D4;border-radius:6px;}
@media(max-width:960px){.kpi-row{grid-template-columns:repeat(2,1fr);}.two-col,.report-grid,.help-grid,.tabbed{grid-template-columns:1fr;}.sidebar{width:210px;}.field-row3,.field-row4{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- ======================= LOGIN SCREEN ======================= -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="mark">CBC</div>
    <h2>CBC Loan Monitoring</h2>
    <p>Sign in with your staff account to continue.</p>
    <div class="login-err hidden" id="loginErr"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center;" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<!-- ======================= APP SHELL ======================= -->
<div class="app-shell hidden" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="bell"><span class="dot" id="alertDot" style="display:none;"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </div>
      <div class="av" id="topAv">–</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — fill these in with your Supabase project's values:
   Project → Settings → API → Project URL / anon public key
   ============================================================ */
const SUPABASE_URL = 'https://wcketeysehpyrgkuvvbj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indja2V0ZXlzZWhweXJna3V2dmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1Njg2NjcsImV4cCI6MjEwMjE0NDY2N30.Tq9lv2iTX0NtIN-Ph7sVSva4ycKX1vu9GWG0Ya71xoo';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- ICONS ---------- */
const I = {
  grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15.5 14.2c2.7.4 4.9 2.5 4.9 5.8"/>',
  sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h13M21 18h-1"/><circle cx="15" cy="6" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="19" cy="18" r="2"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  report:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1M9 12l2 2 4-4"/>',
  shield:'<path d="M12 2l8 3.5v6c0 5-3.4 8.6-8 10.5C7.4 20.1 4 16.5 4 11.5v-6z"/><path d="M9 12l2 2 4-4"/>',
  folder:'<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  landmark:'<path d="M3 21h18M4 21V9M20 21V9M2 9l10-6 10 6M8 21v-6M12 21v-6M16 21v-6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 110-4h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.2a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1H21a2 2 0 110 4h-.2a1.7 1.7 0 00-1.6 1z"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 115.8 1c0 2-3 2-3 4M12 17h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  download:'<path d="M12 3v13M6 11l6 6 6-6M4 21h16"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'
};
function ic(name,cls){return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[name]+'</svg>';}

/* ---------- GLOBAL STATE (local cache, kept in sync via realtime) ---------- */
let state = {branches:[],profiles:[],products:[],clients:[],applications:[],documents:[],evaluations:[],creditScores:[],disbursements:[],repayments:[],settings:{},auditLog:[]};
let currentUser = null, currentProfile = null;
let currentView = 'overview', branchFilter = '', settingsTab = 'general';
const STAGES = ['Enrollment','Validation','Endorsement','Approving Authority Review','Approved','Disbursed'];
const TERMINAL_OUTCOMES = ['Differed','Disapproved']; // reachable only from 'Approving Authority Review', outside the linear STAGES track

/* ---------- HELPERS ---------- */
const peso = n => '\u20B1'+Math.round(n||0).toLocaleString();
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '—';
function branchName(id){ return (state.branches.find(b=>b.id===id)||{}).name || '—'; }
function productName(id){ return (state.products.find(p=>p.id===id)||{}).name || '—'; }
function clientName(id){ return (state.clients.find(c=>c.id===id)||{}).name || '—'; }
function branchOptions(sel){ return state.branches.map(b=>'<option value="'+b.id+'"'+(b.id===sel?' selected':'')+'>'+b.name+'</option>').join(''); }
function productOptions(sel){ return state.products.map(p=>'<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+p.name+'</option>').join(''); }
function clientOptions(sel){ return '<option value="">— new client / new applicant —</option>'+state.clients.map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+c.name+'</option>').join(''); }
function appOptions(list,sel){ return list.map(a=>'<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+a.code+' — '+a.applicant_name+'</option>').join(''); }
function slaStatus(days){ const sla = state.settings.sla_days||3; if(days>sla) return 'risk'; if(days===sla) return 'warn'; return 'ok'; }
function daysSince(ts){ return Math.max(0, Math.floor((Date.now()-new Date(ts).getTime())/86400000)); }
function requiredDocsFor(productId, securityType, collateralType){
  const p = state.products.find(x=>x.id===productId);
  let base = ['Valid ID','2x2 ID Picture','Proof of membership','Application form'];
  if(p){
    if(/agri/i.test(p.name)) base = base.concat(['Land title / tenancy proof','Farm plan & budget']);
    else if(/business/i.test(p.name)) base = base.concat(['Business permit','Latest financial statement']);
    else if(/salary/i.test(p.name)) base = base.concat(['Certificate of employment','Latest 2 payslips']);
  }
  if(securityType==='Secured'){
    if(collateralType==='Chattel Mortgage'){
      base = base.concat(['Official Receipt (OR) / Certificate of Registration (CR)','Deed of Chattel Mortgage','Appraisal Report']);
    } else {
      base = base.concat(['Transfer Certificate of Title (TCT) / Tax Declaration','Tax Clearance / Real Property Tax Receipt','Real Estate Mortgage document','Appraisal Report']);
    }
  }
  return [...new Set(base)];
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
function filteredApplications(){ return branchFilter ? state.applications.filter(a=>a.branch_id===branchFilter) : state.applications; }
function dbErr(error){ if(error){ showToast('Error: '+error.message); return true; } return false; }
async function uploadFileToStorage(pathPrefix, file){
  const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = pathPrefix+'/'+Date.now()+'-'+cleanName;
  const {error} = await sb.storage.from('loan-documents').upload(path, file, {upsert:true});
  if(error) return {error};
  const {data} = sb.storage.from('loan-documents').getPublicUrl(path);
  return {path, url:data.publicUrl, name:file.name};
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============================================================
   DATA LAYER — every read/write goes through Supabase.
   ============================================================ */
async function fetchTable(name){
  const map = {
    branches: ()=> sb.from('branches').select('*').order('name'),
    profiles: ()=> sb.from('profiles').select('*'),
    products: ()=> sb.from('products').select('*').order('name'),
    clients: ()=> sb.from('clients').select('*').order('name'),
    applications: ()=> sb.from('v_applications').select('*').order('created_at',{ascending:false}),
    documents: ()=> sb.from('documents').select('*'),
    evaluations: ()=> sb.from('evaluations').select('*'),
    creditScores: ()=> sb.from('credit_scores').select('*'),
    disbursements: ()=> sb.from('disbursements').select('*'),
    repayments: ()=> sb.from('repayments').select('*').order('due_date'),
    settings: ()=> sb.from('settings').select('*').single(),
    auditLog: ()=> sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200)
  };
  const {data, error} = await map[name]();
  if(dbErr(error)) return;
  state[name] = data;
}
async function loadAll(){
  await Promise.all(['branches','profiles','products','clients','applications','documents','evaluations','creditScores','disbursements','repayments','settings','auditLog'].map(fetchTable));
}
function docsFor(appId){ return state.documents.filter(d=>d.application_id===appId); }
function evalFor(appId){ return state.evaluations.filter(e=>e.application_id===appId).sort((a,b)=>new Date(b.assigned_at)-new Date(a.assigned_at))[0]; }
function scoreFor(appId){ return state.creditScores.find(s=>s.application_id===appId); }

/* ---------- REALTIME: keep every open tab in sync ---------- */
function subscribeRealtime(){
  const tables = ['branches','profiles','products','clients','applications','documents','evaluations','credit_scores','disbursements','repayments','settings'];
  const keyMap = {credit_scores:'creditScores'};
  tables.forEach(t=>{
    sb.channel('rt-'+t).on('postgres_changes', {event:'*', schema:'public', table:t}, async ()=>{
      await fetchTable(keyMap[t]||t);
      renderAll();
    }).subscribe();
  });
}

/* Client-side mirror of v_risk_alerts, used for quick badges without a round trip */
function computeAlertsLocal(){
  const alerts = [];
  filteredApplications().forEach(a=>{
    if(['Disbursed','Differed','Disapproved'].includes(a.stage)) return;
    if(a.days_in_stage > (state.settings.sla_days||3)) alerts.push({priority:'High', text:a.applicant_name+' — SLA breached at '+a.stage, meta:branchName(a.branch_id)+' · '+a.days_in_stage+' days in stage · '+a.code, owner:a.officer||'Unassigned'});
  });
  state.repayments.forEach(r=>{
    if(r.status==='Pending' && new Date(r.due_date).getTime() < Date.now()){
      const dpd = daysSince(r.due_date);
      alerts.push({priority: dpd>30?'High':'Medium', text: clientName(r.client_id)+' — payment '+dpd+' days past due', meta:(r.loan_ref||'')+' · '+peso(r.amount_due)+' due '+fmtDate(r.due_date), owner:'Collections'});
    }
  });
  return alerts;
}

function rowStageHTML(a){ const st=slaStatus(a.days_in_stage); return `<tr><td>${a.applicant_name}<div style="font-size:11px;color:var(--ink-soft)">${a.code}</div></td><td>${branchName(a.branch_id)}</td><td>${peso(a.amount)}</td><td>${stageTrack(a.stage,st)}</td><td><span class="badge ${st}">${a.days_in_stage}d</span></td></tr>`; }
function stageTrack(stage,status){
  if(TERMINAL_OUTCOMES.includes(stage)){
    const cls = stage==='Disapproved' ? 'risk' : 'warn';
    return '<span class="badge '+cls+'">'+stage+'</span>';
  }
  const idx=STAGES.indexOf(stage); let seg=''; for(let i=0;i<5;i++){ let cls='seg'+(i<=idx?' filled'+(i===idx&&status!=='ok'?' '+status:''):''); seg+='<div class="'+cls+'"></div>'; } return '<div class="stage-track">'+seg+'<span class="lbl">'+stage+'</span></div>';
}
function wireQuickActions(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const act = el.dataset.action;
      if(act==='newApp') return modalNewApplication();
      if(act==='newClient') return modalNewClient(true);
      if(act==='newDisbursement') return modalCreateDisbursement();

    if(stage) rows = rows.filter(a=>a.stage===stage);
    if(sla) rows = rows.filter(a=>slaStatus(a.days_in_stage)===sla);
    if(q) rows = rows.filter(a=>(a.applicant_name+a.code).toLowerCase().includes(q));
    document.getElementById('appTbody').innerHTML = rows.length ? rows.map(a=>{
      const st = slaStatus(a.days_in_stage); const idx = STAGES.indexOf(a.stage); const nextIdx = idx+1;
      const canAdvance = idx>=0 && nextIdx<STAGES.length && a.stage!=='Approving Authority Review';
      const isTerminal = TERMINAL_OUTCOMES.includes(a.stage);
      const actionCell = canAdvance ? `<button class="btn sm" data-adv="${a.id}">Advance →</button>` : (a.stage==='Approving Authority Review' ? `<span class="badge warn">Awaiting decision</span>` : isTerminal ? `<span class="badge ${a.stage==='Disapproved'?'risk':'warn'}">${a.stage}</span>` : `<span class="badge ok">Complete</span>`);

  };
  ['fStage','fSla'].forEach(id=>document.getElementById(id).addEventListener('change',draw));

async function advanceStage(id){
  const a = state.applications.find(x=>x.id===id); if(!a) return;
  const idx = STAGES.indexOf(a.stage); if(idx>=STAGES.length-1) return;
  const nextStage = STAGES[idx+1];
  const {error} = await sb.from('applications').update({stage:nextStage, stage_entered_at:new Date().toISOString()}).eq('id', id);
  if(dbErr(error)) return;
  if(nextStage==='Validation' && docsFor(id).length===0){
    const reqDocs = requiredDocsFor(a.product_id, a.security_type, a.collateral_type);
    await sb.from('documents').insert(reqDocs.map(name=>({application_id:id, doc_name:name, category:'Standard'})));
  }
  showToast('Moved to '+nextStage);
  await fetchTable('applications'); await fetchTable('documents'); renderAll();
}

function cifRowVal(data,prefix,field){ return (data[prefix+field]||'').toString().trim(); }
function buildClientPayloadFromForm(data, prefix){
  const v = (f)=>cifRowVal(data,prefix,f);
  const fullName = [v('FirstName'), v('MiddleName'), v('LastName')].filter(Boolean).join(' ') + (v('Suffix')?' '+v('Suffix'):'');
  const personal_info = {
    title:v('Title'), last_name:v('LastName'), first_name:v('FirstName'), middle_name:v('MiddleName'), suffix:v('Suffix'),
    nick_name:v('NickName'), citizenship:v('Citizenship'), birthdate:v('Birthdate')||null,
    birth_city:v('BirthCity'), birth_province:v('BirthProvince'),
    present_address:v('PresentAddress'), permanent_address:v('PermanentAddress')||v('PresentAddress'),
    preferred_mailing:v('PreferredMailing'), civil_status:v('CivilStatus'), tin:v('Tin'), sss_gsis:v('SssGsis'),
    mobile_phone:v('MobilePhone'), telephone:v('Telephone'), email:v('Email'),
    father:{last_name:v('FatherLastName'), first_name:v('FatherFirstName'), middle_name:v('FatherMiddleName')},
    mother:{last_name:v('MotherLastName'), first_name:v('MotherFirstName'), middle_name:v('MotherMiddleName')}
  };
  const financial_info = {
    employment_status:v('EmploymentStatus'), occupation:v('Occupation'), source_of_funds:v('SourceOfFunds'),
    annual_income:v('AnnualIncome'), account_purpose:v('AccountPurpose'),
    employer_name:v('EmployerName'), employer_address:v('EmployerAddress'), position:v('Position'), employed_since:v('EmployedSince')||null,
    business_name:v('BusinessName'), business_address:v('BusinessAddress'), nature_of_business:v('NatureOfBusiness'),
    politician_level:v('PoliticianLevel'), politician_position:v('PoliticianPosition'), date_elected:v('DateElected')||null,
    office_address:v('OfficeAddress'), politician_salary:v('PoliticianSalary')||null, years_as_politician:v('YearsAsPolitician')||null,
    farmer_hectares:v('FarmerHectares')||null, farmer_crops:v('FarmerCrops')
  };
  const spouse_info = {
    last_name:v('SpouseLastName'), first_name:v('SpouseFirstName'), middle_name:v('SpouseMiddleName'), nick_name:v('SpouseNickName'),
    birthdate:v('SpouseBirthdate')||null, citizenship:v('SpouseCitizenship'), education:v('SpouseEducation'),
    employment_status:v('SpouseEmploymentStatus'), tin:v('SpouseTin'), sss_gsis:v('SpouseSssGsis'),
    mobile_phone:v('SpouseMobilePhone'), telephone:v('SpouseTelephone'), email:v('SpouseEmail'),
    occupation:v('SpouseOccupation'), employer_or_business:v('SpouseEmployerOrBusiness'), work_address:v('SpouseWorkAddress'),
    position:v('SpousePosition'), employed_since:v('SpouseEmployedSince')||null, salary:v('SpouseSalary')||null
  };
  const dependents = [1,2,3].map(i=>({
    name:v('Dep'+i+'Name'), address:v('Dep'+i+'Address'), dob:v('Dep'+i+'Dob')||null, employment_status:v('Dep'+i+'EmpStatus'), relationship:v('Dep'+i+'Relationship')
  })).filter(d=>d.name);
  const bank_accounts = [1,2,3].map(i=>({
    bank_name:v('Bank'+i+'Name'), branch:v('Bank'+i+'Branch'), type:v('Bank'+i+'Type'), account_no:v('Bank'+i+'AcctNo'), date_opened:v('Bank'+i+'DateOpened')||null
  })).filter(b=>b.bank_name);
  const credit_cards = [1,2,3].map(i=>({
    company:v('Cc'+i+'Company'), issuer:v('Cc'+i+'Issuer'), limit:v('Cc'+i+'Limit')||null, number:v('Cc'+i+'Number'), expiry:v('Cc'+i+'Expiry')||null
  })).filter(c=>c.company);
  const other_info = {
    beneficiary:{ name:v('BeneficiaryName'), dob:v('BeneficiaryDob')||null, address:v('BeneficiaryAddress'), occupation:v('BeneficiaryOccupation'), birthplace:v('BeneficiaryBirthplace'), source_of_fund:v('BeneficiarySourceOfFund') },
    dependents, bank_accounts, credit_cards,
    misc:{
      pending_case: v('PendingCase')==='Yes', pending_case_details:v('PendingCaseDetails'),
      bank_closed: v('BankClosed')==='Yes', bank_closed_details:v('BankClosedDetails'),
      related_employee: v('RelatedEmployee')==='Yes', related_employee_name:v('RelatedEmployeeName'), related_employee_relationship:v('RelatedEmployeeRelationship')
    }
  };
  return { name: fullName, personal_info, financial_info, spouse_info, other_info, created_by: currentUser.id };
}
function wireSpouseToggle(prefix){
  const civilSelect = document.getElementById(prefix+'CivilStatusSelect');
  const spouseSection = document.getElementById(prefix+'SpouseSection');
  if(!civilSelect || !spouseSection) return;
  const toggle = ()=>{
    const isMarried = civilSelect.value === 'Married';
    spouseSection.style.display = isMarried ? '' : 'none';
    spouseSection.querySelectorAll('input,select').forEach(el=>{
      if(el.dataset.origRequired===undefined) el.dataset.origRequired = el.required ? '1' : '0';
      el.required = isMarried ? (el.dataset.origRequired==='1') : false;
      if(!isMarried) el.value = '';
    });
  };
  civilSelect.addEventListener('change', toggle);
  toggle();
}
function cifRequiredOk(data, prefix){
  const v = (f)=>cifRowVal(data,prefix,f);
  const must = ['LastName','FirstName','Citizenship','Birthdate','BirthCity','BirthProvince','PresentAddress','PreferredMailing','CivilStatus','MobilePhone','FatherLastName','FatherFirstName','MotherLastName','MotherFirstName','EmploymentStatus','Occupation','SourceOfFunds','AnnualIncome','AccountPurpose','PendingCase','BankClosed','RelatedEmployee'];
  return must.every(f=>v(f));
}

   NEW LOAN APPLICATION — client picker + full CIF form + loan details
   ============================================================ */
function modalNewApplication(prefill){
  const bodyHTML = `
    <div class="form-section" style="margin-top:0;padding-top:0;border-top:none;">
      <h4><span class="num">0</span>Applicant</h4>
      <div class="field"><label>Existing client (pick to skip the form below) — or leave as "new" to register a new applicant</label><select name="clientId" id="napClientSelect">${clientOptions(prefill&&prefill.clientId)}</select></div>
    </div>
    <div id="napNewApplicantFields">${cifFieldsHTML('nap', true)}</div>
    <div class="form-section">
      <h4><span class="num">6</span>Loan details</h4>
      <div class="field-row">
        <div class="field"><label>Branch*</label><select name="branch" required>${branchOptions()}</select></div>
        <div class="field"><label>Loan product*</label><select name="loanType" required>${productOptions()}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Amount requested (₱)*</label><input name="amount" type="number" min="1000" step="1000" required placeholder="50000"></div>
        <div class="field"><label>Officer assigned</label><input name="officer" placeholder="e.g. J. Domingo"></div>
      </div>
    </div>
    <div class="form-section">
      <h4><span class="num">7</span>Security &amp; documentary requirements</h4>
      <div class="field"><label>Loan security*</label><select name="securityType" id="napSecurityType" required><option value="Unsecured">Unsecured</option><option value="Secured">Secured</option></select></div>
      <div id="napUnsecuredNote" class="mini-note" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;color:var(--ok-ink);">Unsecured loan — the checklist created in Document Center will require: Valid ID, 2x2 ID Picture, Proof of membership, Application form, plus any product-specific documents. No collateral upload needed.</div>
      <div id="napSecuredFields" class="hidden">
        <div class="field"><label>Collateral type*</label><select name="collateralType" id="napCollateralType"><option value="Real Estate Mortgage (REM)">Real Estate Mortgage (REM)</option><option value="Chattel Mortgage">Chattel Mortgage</option></select></div>
        <div class="field"><label>Upload collateral documents (title/OR-CR, tax declaration, appraisal, etc. — you can add more later in Document Center)</label><input type="file" name="collateralFiles" multiple></div>
        <div class="mini-note" style="background:#EAF0FB;border-radius:8px;padding:10px 12px;color:var(--blue);">Secured loan — the checklist will also require the collateral-specific documents for the type chosen above (e.g. TCT/Tax Declaration + Tax Clearance for REM, or OR/CR + Deed of Chattel Mortgage for Chattel), in addition to the standard requirements.</div>
      </div>
    </div>
  `;
  const close = openModal('New loan application', bodyHTML, async (data,close)=>{
    let clientId = data.clientId;
    if(!clientId){
      if(!cifRequiredOk(data,'nap')){ showToast('Please complete all required (*) applicant fields'); return; }
      const payload = buildClientPayloadFromForm(data,'nap');
      const {data:cl,error} = await sb.from('clients').insert(payload).select().single();
      if(dbErr(error)) return; clientId = cl.id;
    }
    const applicant = clientName(clientId) !== '—' ? clientName(clientId) : (data.napFirstName ? [data.napFirstName,data.napLastName].join(' ') : 'Applicant');
    const securityType = data.securityType || 'Unsecured';
    const collateralType = securityType==='Secured' ? (data.collateralType||'Real Estate Mortgage (REM)') : null;
    const {data:app, error} = await sb.from('applications').insert({applicant_name:applicant, client_id:clientId, branch_id:data.branch, product_id:data.loanType, amount:Number(data.amount), officer:data.officer||'', security_type:securityType, collateral_type:collateralType, stage:'Enrollment', created_by:currentUser.id}).select().single();
    if(dbErr(error)) return;

    // auto-log the documentary requirements checklist for this application
    const reqDocs = requiredDocsFor(data.loanType, securityType, collateralType);
    await sb.from('documents').insert(reqDocs.map(name=>({application_id:app.id, doc_name:name, category:'Standard'})));

    // upload any collateral files attached at creation time
    const fileInput = document.querySelector('[name="collateralFiles"]');
    if(securityType==='Secured' && fileInput && fileInput.files && fileInput.files.length){
      for(const file of fileInput.files){
        const up = await uploadFileToStorage('app-'+app.id, file);
        if(up.error){ showToast('File upload failed: '+up.error.message); continue; }
        await sb.from('documents').insert({application_id:app.id, doc_name:'Collateral file — '+up.name, category:'Collateral', verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id, file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString()});
      }
    }

    showToast('Application '+app.code+' created — document checklist logged'); close();
    await fetchTable('applications'); await fetchTable('clients'); await fetchTable('documents'); currentView='applications'; renderAll();
  }, 'Create application', true);
  setTimeout(()=>{
    const sel = document.getElementById('napClientSelect');
    const fieldsWrap = document.getElementById('napNewApplicantFields');
    const toggle = ()=>{
      const isExisting = !!sel.value;
      fieldsWrap.style.display = isExisting ? 'none' : '';
      fieldsWrap.querySelectorAll('input,select').forEach(el=>{
        if(el.dataset.origRequired===undefined) el.dataset.origRequired = el.required ? '1' : '0';
        el.required = isExisting ? false : (el.dataset.origRequired==='1');
      });
    };
    sel.addEventListener('change', toggle);
    toggle();
    wireSpouseToggle('nap');
    const secSel = document.getElementById('napSecurityType');
    const securedFields = document.getElementById('napSecuredFields');
    const unsecuredNote = document.getElementById('napUnsecuredNote');
    const toggleSecurity = ()=>{
      const secured = secSel.value === 'Secured';
      securedFields.classList.toggle('hidden', !secured);
      unsecuredNote.classList.toggle('hidden', secured);
    };
    secSel.addEventListener('change', toggleSecurity);
    toggleSecurity();
  },0);
}

function generateReport(type){
  const apps = filteredApplications();
  if(type==='portfolio') downloadCSV('portfolio-summary.csv', [['Application','Applicant','Branch','Stage','Amount'], ...apps.map(a=>[a.code,a.applicant_name,branchName(a.branch_id),a.stage,a.amount])]);
  else if(type==='pipeline') downloadCSV('application-pipeline.csv', [['Stage','Count'], ...STAGES.map(s=>[s, apps.filter(a=>a.stage===s).length])]);
  else if(type==='delinquency'){ const overdue = state.repayments.filter(r=>r.status==='Pending' && new Date(r.due_date).getTime()<Date.now()); downloadCSV('delinquency-report.csv', [['Client','Loan reference','Amount due','Due date','Days past due'], ...overdue.map(r=>[clientName(r.client_id),r.loan_ref,r.amount_due,fmtDate(r.due_date),daysSince(r.due_date)])]); }
  else if(type==='officer'){ const byOfficer={}; apps.forEach(a=>{ const o=a.officer||'Unassigned'; byOfficer[o]=(byOfficer[o]||0)+1; }); downloadCSV('loan-officer-performance.csv', [['Officer','Applications handled'], ...Object.entries(byOfficer)]); }
  else if(type==='collection'){ const paid = state.repayments.filter(r=>r.status==='Paid'); downloadCSV('repayment-collection.csv', [['Client','Loan reference','Amount','Paid date'], ...paid.map(r=>[clientName(r.client_id),r.loan_ref,r.amount_due,fmtDate(r.paid_date)])]); }
  else if(type==='demographics') downloadCSV('client-demographics.csv', [['Client','Employment status','Civil status'], ...state.clients.map(cl=>[cl.name,(cl.financial_info||{}).employment_status,(cl.personal_info||{}).civil_status])]);
  else if(type.startsWith('listing-')){
    const outcome = {'listing-approved':'Approved','listing-differed':'Differed','listing-disapproved':'Disapproved'}[type];
    const list = apps.filter(a=>a.stage===outcome || (outcome==='Approved' && a.stage==='Disbursed'));
    downloadCSV('listing-'+outcome.toLowerCase()+'.csv', [['Application','Applicant','Branch','Product','Amount','Decision date','Remarks'], ...list.map(a=>[a.code,a.applicant_name,branchName(a.branch_id),productName(a.product_id),a.amount,fmtDate(a.stage_entered_at),a.decision_remarks||''])]);
  }
  showToast('Report downloaded');
}

function renderEvaluation(){
  const rows = filteredApplications().filter(a=>['Validation','Endorsement'].includes(a.stage) || scoreFor(a.id));

  c.innerHTML = `<div class="page-head"><div><div class="eyebrow">Client validation & CIBI</div><h1>Validation (CIBI)</h1><p>Assign each enrolled client to an Evaluation Staff for Credit Investigation & Background Investigation, run the BCRRS scorecard and cash-flow check, generate the evaluation report, then endorse to the Approving Authority — all in one place.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn primary" data-action="assignEval">${ic('plus')} Assign evaluator</button><button class="btn primary" data-action="runScorecard">${ic('plus')} Run BCRRS scorecard</button></div></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;"><div class="kpi"><div class="lbl">Work queue</div><div class="val">${rows.length}</div></div><div class="kpi"><div class="lbl">Requires attention</div><div class="val">${attention}</div></div><div class="kpi"><div class="lbl">Performance</div><div class="val">${rows.length?Math.round(((rows.length-attention)/rows.length)*100):100}%</div></div></div>
  <div class="panel"><div class="panel-head"><h2>Validation & CIBI queue</h2></div><p class="sub">Live across ${branchFilter?branchName(branchFilter):'all branches'}.</p>
  <table><thead><tr><th>Application</th><th>Applicant</th><th>Evaluation Staff</th><th>BCRRS score</th><th>Risk classification</th><th>DBR</th><th>Max loan</th><th>Assessment</th><th></th></tr></thead>
  <tbody>${rows.length ? rows.map(a=>{
    const st=slaStatus(a.days_in_stage); const ev=evalFor(a.id); const s=scoreFor(a.id); const band=s?bcrrsBandFor(Number(s.score)):null;
    const canEndorse = s && a.stage==='Endorsement';
    return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td>${ev?ev.assigned_to:'<span class="badge neutral">Unassigned</span>'}</td><td>${s?Number(s.score).toFixed(2):'—'}</td><td>${band?'<span class="badge '+band.cls+'">'+band.label+'</span>':'<span class="badge neutral">Not scored</span>'}</td><td>${s?s.dti+'%':'—'}</td><td>${s&&s.max_loan_amount!=null?peso(s.max_loan_amount):'—'}</td><td>${s?s.decision:'—'}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn sm" data-assign="${a.id}">Assign</button>${a.stage==='Validation'?`<button class="btn sm" data-adv2="${a.id}">Advance →</button>`:''}${s?`<button class="btn sm" data-report="${a.id}">${ic('report')} Report</button>`:''}${canEndorse?`<button class="btn sm primary" data-endorse="${a.id}">Endorse →</button>`:''}</td></tr>`;
  }).join('') : '<tr class="empty-row"><td colspan="9">No records match your search.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="assignEval"]').addEventListener('click',()=>modalAssignEvaluator());
  document.querySelector('[data-action="runScorecard"]').addEventListener('click',modalRunScorecard);
  c.querySelectorAll('[data-assign]').forEach(b=>b.addEventListener('click',()=>modalAssignEvaluator(b.dataset.assign)));
  c.querySelectorAll('[data-adv2]').forEach(b=>b.addEventListener('click',()=>advanceStage(b.dataset.adv2)));
  c.querySelectorAll('[data-report]').forEach(b=>b.addEventListener('click',()=>printEvaluationReport(b.dataset.report)));
  c.querySelectorAll('[data-endorse]').forEach(b=>b.addEventListener('click', async ()=>{
    const {error}=await sb.from('applications').update({stage:'Approving Authority Review', stage_entered_at:new Date().toISOString()}).eq('id', b.dataset.endorse);
    if(dbErr(error)) return; showToast('Endorsed to Approving Authority'); await fetchTable('applications'); renderAll();
  }));
}
function modalAssignEvaluator(appId){
  const pool = filteredApplications().filter(a=>['Validation','Endorsement'].includes(a.stage));
  openModal('Assign to Evaluation Staff (CIBI)', `<div class="field"><label>Application</label><select name="appId">${appOptions(pool, appId)}</select></div><div class="field"><label>Evaluation Staff name</label><input name="assignedTo" required placeholder="e.g. R. Cauilan"></div>`, async (data,close)=>{
    const {error} = await sb.from('evaluations').insert({application_id:data.appId, assigned_to:data.assignedTo});

function modalRunScorecard(prefillAppId){
  const pool = filteredApplications();
  if(!pool.length){ openModal('Run scorecard', '<p style="color:var(--ink-soft);font-size:13px;">No applications exist yet — enroll a client first.</p>', (d,close)=>close(), 'Close'); return; }
  let bodyHTML = `<div class="field"><label>Pick a client / application*</label><select name="appId" id="scAppId" required>${appOptions(pool, prefillAppId)}</select></div>`;
  bodyHTML += `<div class="form-section"><h4><span class="num">1</span>Cash flow & debt capacity (monthly, ₱)</h4>
    <div class="field-row3"><div class="field"><label>Salary / wages (net)</label><input name="cfSalary" type="number" step="0.01" value="0"></div><div class="field"><label>Business income (net)</label><input name="cfBusiness" type="number" step="0.01" value="0"></div><div class="field"><label>Other income</label><input name="cfOther" type="number" step="0.01" value="0"></div></div>
    <div class="field-row3"><div class="field"><label>Food & groceries</label><input name="cfFood" type="number" step="0.01" value="0"></div><div class="field"><label>Utilities</label><input name="cfUtilities" type="number" step="0.01" value="0"></div><div class="field"><label>Transportation</label><input name="cfTransport" type="number" step="0.01" value="0"></div></div>
    <div class="field-row3"><div class="field"><label>Education / allowance</label><input name="cfEducation" type="number" step="0.01" value="0"></div><div class="field"><label>Existing loan amortization</label><input name="cfExisting" type="number" step="0.01" value="0"></div><div class="field"><label>Other household expenses</label><input name="cfOtherHH" type="number" step="0.01" value="0"></div></div>
    <div id="cfLive" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.7;"></div>
  </div>`;
  BCRRS_CATEGORIES.forEach(([catName,weight,factors],ci)=>{
    bodyHTML += `<div class="form-section"><h4><span class="num">${ci+2}</span>${catName} <span style="font-weight:400;text-transform:none;color:var(--ink-soft);">(weight ${Math.round(weight*100)}%)</span></h4>`;
    factors.forEach(([num,fname,options])=>{
      bodyHTML += `<div class="field"><label>${num}. ${fname}</label><select name="f${num}" data-factor="${num}">${options.map(([text,score])=>`<option value="${score}">${text} (${score})</option>`).join('')}</select></div>`;
    });
    bodyHTML += `</div>`;
  });
  const close = openModal('Run BCRRS scorecard & cash flow', bodyHTML, async (data,close)=>{
    const factor_scores = {}; for(let i=1;i<=26;i++) factor_scores[i]=Number(data['f'+i]||0);
    const cashflow = {salary:Number(data.cfSalary||0),business_income:Number(data.cfBusiness||0),other_income:Number(data.cfOther||0),
      food_groceries:Number(data.cfFood||0),utilities:Number(data.cfUtilities||0),transportation:Number(data.cfTransport||0),
      education:Number(data.cfEducation||0),existing_loan:Number(data.cfExisting||0),other_household:Number(data.cfOtherHH||0)};
    const {data:result, error} = await sb.rpc('run_credit_scorecard', {p_application_id:data.appId, p_factor_scores:factor_scores, p_cashflow:cashflow});
    if(dbErr(error)) return;
    const r = result[0];
    // move the application into Endorsement once it's been scored, so it's ready to be endorsed to the Approving Authority
    const a = state.applications.find(x=>x.id===data.appId);
    if(a && (a.stage==='Enrollment' || a.stage==='Validation')) await sb.from('applications').update({stage:'Endorsement', stage_entered_at:new Date().toISOString()}).eq('id', data.appId);
    showToast('Scorecard generated — '+Number(r.score).toFixed(2)+' ('+r.risk_band+', '+r.decision+')'); close();
    await fetchTable('creditScores'); await fetchTable('applications'); renderAll();
  }, 'Run scorecard', true);
  setTimeout(()=>{
    const liveEl = document.getElementById('cfLive');
    const ids = ['cfSalary','cfBusiness','cfOther','cfFood','cfUtilities','cfTransport','cfEducation','cfExisting','cfOtherHH'];
    const recalc = ()=>{
      const v = id=>Number(document.querySelector(`[name="${id}"]`).value||0);
      const income = v('cfSalary')+v('cfBusiness')+v('cfOther');
      const subtotal = v('cfExisting')+v('cfFood')+v('cfUtilities')+v('cfTransport')+v('cfEducation')+v('cfOtherHH');
      const expenses = subtotal*1.2;
      const ndi = income-expenses;
      const dbr = ndi>0 ? (v('cfExisting')/ndi*100) : 0;
      liveEl.innerHTML = `Total income: <b>${peso(income)}</b> &nbsp;·&nbsp; Total expenses (incl. 20% buffer): <b>${peso(expenses)}</b><br>Net Disposable Income: <b>${peso(ndi)}</b> &nbsp;·&nbsp; Debt Burden Ratio: <b>${dbr.toFixed(1)}%</b>`;
    };
    ids.forEach(id=>document.querySelector(`[name="${id}"]`).addEventListener('input',recalc));
    recalc();
  },0);
}

    document.getElementById('ddTbody').innerHTML = rowsD.length ? rowsD.map(d=>{ const app=state.applications.find(a=>a.id===d.application_id)||{}; return `<tr><td>${app.code||'—'}</td><td>${app.applicant_name||'—'}</td><td>${d.doc_name}</td><td><span class="badge ${d.category==='Collateral'?'warn':'neutral'}">${d.category||'Standard'}</span></td><td>${fmtDate(d.uploaded_at)}</td><td><a class="btn sm" href="${d.file_url}" target="_blank" rel="noopener">${ic('folder')} View</a></td></tr>`; }).join('') : '<tr class="empty-row"><td colspan="6">No files uploaded yet.</td></tr>';

async function modalChecklist(appId){
  const pool = filteredApplications();
  if(!pool.length){ openModal('Document checklist', '<p style="color:var(--ink-soft);font-size:13px;">No applications yet.</p>', (d,close)=>close(), 'Close'); return; }
  const id = appId || pool[0].id;
  const a = state.applications.find(x=>x.id===id);
  let d = docsFor(id);
  if(!d.length){
    const reqDocs = requiredDocsFor(a.product_id, a.security_type, a.collateral_type);
    await sb.from('documents').insert(reqDocs.map(name=>({application_id:id, doc_name:name, category:'Standard'})));
    await fetchTable('documents'); d = docsFor(id);
  }
  const rowHTML = doc => `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
    <input type="checkbox" data-doc="${doc.id}" ${doc.verified?'checked':''}>
    <div style="flex:1;">${doc.doc_name}${doc.category==='Collateral'?' <span class="badge warn" style="margin-left:4px;">Collateral</span>':''}${doc.file_name?`<div style="font-size:11px;color:var(--ink-soft);">${doc.file_name}</div>`:''}</div>
    ${doc.file_url?`<a class="btn sm" href="${doc.file_url}" target="_blank" rel="noopener">View</a>`:`<label class="btn sm" style="cursor:pointer;">Upload<input type="file" data-upload="${doc.id}" style="display:none;"></label>`}
  </div>`;
  const listHTML = '<div id="dcList">'+d.map(rowHTML).join('')+'</div>';
  const secBadge = `<div class="mini-note" style="background:${a.security_type==='Secured'?'#EAF0FB':'var(--ok-bg)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;">Security: <b>${a.security_type||'Unsecured'}</b>${a.collateral_type?' — '+a.collateral_type:''}</div>`;
  openModal('Document checklist', '<div class="field"><label>Application</label><select id="dcApp">'+appOptions(pool,id)+'</select></div>'+secBadge+listHTML, (data,close)=>close(), 'Close', true);
  document.getElementById('dcApp').addEventListener('change', e=>{ document.getElementById('modalRoot').innerHTML=''; modalChecklist(e.target.value); });
  document.querySelectorAll('#dcList [data-doc]').forEach(cb=>cb.addEventListener('change', async e=>{
    const {error} = await sb.from('documents').update({verified:e.target.checked, verified_at:e.target.checked?new Date().toISOString():null, verified_by:e.target.checked?currentUser.id:null}).eq('id', e.target.dataset.doc);
    if(dbErr(error)) return;
    await fetchTable('documents'); renderAll();
  }));
  document.querySelectorAll('#dcList [data-upload]').forEach(inp=>inp.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const docId = e.target.dataset.upload;
    const up = await uploadFileToStorage('app-'+id, file);
    if(up.error){ showToast('Upload failed: '+up.error.message); return; }
    const {error} = await sb.from('documents').update({file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString(), verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id}).eq('id', docId);
    if(dbErr(error)) return;
    showToast('File uploaded'); await fetchTable('documents'); document.getElementById('modalRoot').innerHTML=''; modalChecklist(id); renderAll();
  }));
}

function renderApproval(){
  const rows = filteredApplications().filter(a=>a.stage==='Approving Authority Review');

  const c = document.getElementById('content');

  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Awaiting decision</h2></div><p class="sub">Live across ${branchFilter?branchName(branchFilter):'all branches'}.</p>
  <table><thead><tr><th>Application</th><th>Applicant</th><th>Loan amount</th><th>BCRRS score</th><th>Cash flow capacity</th><th>Evaluation Staff</th><th></th></tr></thead>
  <tbody>${rows.length ? rows.map(a=>{
    const s=scoreFor(a.id); const ev=evalFor(a.id); const band = s?bcrrsBandFor(Number(s.score)):null;
    const exceeds = s && s.max_loan_amount!=null && Number(a.amount) > Number(s.max_loan_amount);
    return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td>${peso(a.amount)}</td><td>${band?Number(s.score).toFixed(2)+' — <span class="badge '+band.cls+'">'+s.decision+'</span>':'Not scored'}</td><td>${s&&s.max_loan_amount!=null?(exceeds?'<span class="badge risk">Exceeds '+peso(s.max_loan_amount)+'</span>':'<span class="badge ok">Within '+peso(s.max_loan_amount)+'</span>'):'—'}</td><td>${ev?ev.assigned_to:'—'}</td><td style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn sm primary" data-decide="${a.id}" data-outcome="Approved">Approve</button> <button class="btn sm" data-decide="${a.id}" data-outcome="Differed">Differ</button> <button class="btn sm danger" data-decide="${a.id}" data-outcome="Disapproved">Disapprove</button></td></tr>`;
  }).join('') : '<tr class="empty-row"><td colspan="7">No cases awaiting decision.</td></tr>'}</tbody></table></div>`;
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Recent decisions</h2></div><p class="sub">Latest 8 — Approved, Differed, or Disapproved.</p>
  <table><thead><tr><th>Application</th><th>Applicant</th><th>Decision</th><th>Remarks</th><th>Decided</th></tr></thead>
  <tbody>${decided.slice(0,8).map(a=>{ const cls = a.stage==='Disapproved'?'risk':a.stage==='Differed'?'warn':'ok'; return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td><span class="badge ${cls}">${a.stage==='Disbursed'?'Approved':a.stage}</span></td><td style="font-size:12px;color:var(--ink-soft);">${a.decision_remarks||'—'}</td><td>${fmtDate(a.stage_entered_at)}</td></tr>`; }).join('') || '<tr class="empty-row"><td colspan="5">No decisions yet.</td></tr>'}</tbody></table></div>`;
  c.querySelectorAll('[data-decide]').forEach(b=>b.addEventListener('click',()=>modalDecision(b.dataset.decide, b.dataset.outcome)));
  document.querySelector('[data-action="openQueue"]').addEventListener('click',()=>showToast(rows.length+' case(s) awaiting decision'));
}
function modalDecision(appId, outcome){
  const a = state.applications.find(x=>x.id===appId);
  const labels = {Approved:'Approve this application',Differed:'Differ this application (defer for more information)',Disapproved:'Disapprove this application'};
  openModal(labels[outcome]||'Decision', `<div class="mini-note" style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;">${a.code} — ${a.applicant_name} — ${peso(a.amount)}</div>
  <div class="field"><label>Remarks${outcome!=='Approved'?'*':''}</label><textarea name="remarks" rows="3" placeholder="Reason / notes for this decision"${outcome!=='Approved'?' required':''}></textarea></div>`, async (data,close)=>{
    const {error} = await sb.from('applications').update({stage:outcome, stage_entered_at:new Date().toISOString(), decision_remarks:data.remarks||''}).eq('id', appId);
    if(dbErr(error)) return;
    showToast('Application '+outcome.toLowerCase()); close(); await fetchTable('applications'); renderAll();
  }, labels[outcome]||'Confirm');
}

  const dList = state.disbursements.filter(d=>!branchFilter || (state.applications.find(a=>a.id===d.application_id)||{}).branch_id===branchFilter);
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Disbursements queue</h2></div><p class="sub">Live across ${branchFilter?branchName(branchFilter):'all branches'}.</p>
  <table><thead><tr><th>Loan reference</th><th>Borrower</th><th>Loan amount</th><th>Deductions</th><th>Net proceeds</th><th>Release method</th><th>Scheduled date</th><th>Status</th></tr></thead>
  <tbody>${dList.length ? dList.map(d=>{const a=state.applications.find(x=>x.id===d.application_id)||{}; const ded=(d.notarial_fee||0)+(d.filing_fee||0)+(d.insurance_fee||0)+(d.other_deductions||0); const net=d.net_proceeds!=null?d.net_proceeds:(d.amount-ded); return `<tr><td>${a.code||'—'}</td><td>${a.applicant_name||'—'}</td><td>${peso(d.amount)}</td><td>${peso(ded)}</td><td><b>${peso(net)}</b></td><td>${d.method}</td><td>${fmtDate(d.scheduled_date)}</td><td><span class="badge ok">Released</span></td></tr>`;}).join('') : '<tr class="empty-row"><td colspan="8">No records match your search.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="createDisb"]').addEventListener('click',()=>modalCreateDisbursement());
}
function modalCreateDisbursement(){
  const pool = filteredApplications().filter(a=>a.stage==='Approved');
  if(!pool.length){ openModal('Create disbursement', '<p style="color:var(--ink-soft);font-size:13px;">No approved applications are ready for release. Approve a case first.</p>', (d,close)=>close(), 'Close'); return; }
  const bodyHTML = `<div class="field"><label>Approved application</label><select name="appId" id="cdAppId" required>${appOptions(pool)}</select></div>
  <div class="field-row"><div class="field"><label>Release method</label><select name="method"><option>Bank transfer</option><option>Cash</option><option>Check</option></select></div><div class="field"><label>Scheduled date</label><input name="date" type="date" required></div></div>
  <div class="form-section"><h4><span class="num">1</span>Deductions</h4>
    <div class="field-row"><div class="field"><label>Notarial fee (₱)</label><input name="notarialFee" id="cdNotarial" type="number" step="0.01" value="0"></div><div class="field"><label>Filing fee (₱)</label><input name="filingFee" id="cdFiling" type="number" step="0.01" value="0"></div></div>
    <div class="field-row"><div class="field"><label>Insurance (₱)</label><input name="insuranceFee" id="cdInsurance" type="number" step="0.01" value="0"></div><div class="field"><label>Other deductions (₱)</label><input name="otherDeductions" id="cdOther" type="number" step="0.01" value="0"></div></div>
    <div class="field"><label>Other deductions — note</label><input name="otherDeductionsNote" placeholder="e.g. documentary stamp tax"></div>
    <div id="cdLive" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;"></div>
  </div>`;
  openModal('Create disbursement', bodyHTML, async (data,close)=>{
    const a = state.applications.find(x=>x.id===data.appId);
    const {error:e1} = await sb.from('disbursements').insert({application_id:a.id, amount:a.amount, method:data.method, scheduled_date:data.date,
      notarial_fee:Number(data.notarialFee||0), filing_fee:Number(data.filingFee||0), insurance_fee:Number(data.insuranceFee||0),
      other_deductions:Number(data.otherDeductions||0), other_deductions_note:data.otherDeductionsNote||'', created_by:currentUser.id});
    if(dbErr(e1)) return;
    const {error:e2} = await sb.from('applications').update({stage:'Disbursed', stage_entered_at:new Date().toISOString()}).eq('id', a.id);
    if(dbErr(e2)) return;
    const term = (state.products.find(p=>p.id===a.product_id)||{}).term || 12;
    const dueDate = new Date(new Date(data.date).getTime()+30*86400000).toISOString().slice(0,10);
    const {error:e3} = await sb.from('repayments').insert({client_id:a.client_id, application_id:a.id, loan_ref:a.code+' — installment 1', amount_due:Math.round(a.amount/term), due_date:dueDate, status:'Pending'});
    if(dbErr(e3)) return;
    showToast('Loan released — repayment schedule created'); close();
    await fetchTable('disbursements'); await fetchTable('applications'); await fetchTable('repayments'); renderAll();
  }, 'Release loan', true);
  setTimeout(()=>{
    const appSel = document.getElementById('cdAppId');
    const ids = ['cdNotarial','cdFiling','cdInsurance','cdOther'];
    const recalc = ()=>{
      const a = state.applications.find(x=>x.id===appSel.value);
      const grossAmt = a ? Number(a.amount) : 0;
      const ded = ids.reduce((s,id)=>s+Number(document.getElementById(id).value||0),0);
      const net = grossAmt - ded;
      document.getElementById('cdLive').innerHTML = `Loan amount: <b>${peso(grossAmt)}</b> &nbsp;−&nbsp; Total deductions: <b>${peso(ded)}</b> &nbsp;=&nbsp; Net proceeds: <b>${peso(net)}</b>`;
    };
    appSel.addEventListener('change',recalc);
    ids.forEach(id=>document.getElementById(id).addEventListener('input',recalc));
    recalc();
  },0);
}

/* ============================================================
   COLLECTIONS
   ============================================================ */
function renderCollections(){
  const overdue = state.repayments.filter(r=>r.status==='Pending' && new Date(r.due_date).getTime()<Date.now());
  const c = document.getElementById('content');
  c.innerHTML = wsHeader('Collections control','Collections monitoring','Monitor payment schedules, follow up overdue accounts, and record collections.','Record collection', overdue.length, overdue.filter(r=>daysSince(r.due_date)>30).length);
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Collections monitoring queue</h2></div><p class="sub">Live across ${branchFilter?branchName(branchFilter):'all branches'}.</p>
  <table><thead><tr><th>Borrower</th><th>Loan reference</th><th>Amount due</th><th>Due date</th><th>Days past due</th><th>Status</th></tr></thead>
  <tbody>${overdue.length ? overdue.map(r=>`<tr><td>${clientName(r.client_id)}</td><td>${r.loan_ref||'—'}</td><td>${peso(r.amount_due)}</td><td>${fmtDate(r.due_date)}</td><td><span class="badge risk">${daysSince(r.due_date)}d</span></td><td><span class="badge warn">Overdue</span></td></tr>`).join('') : '<tr class="empty-row"><td colspan="6">No records match your search.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="recordColl"]').addEventListener('click',()=>{
    if(!overdue.length){ showToast('No overdue accounts to record'); return; }
    openModal('Record collection', `<div class="field"><label>Overdue account</label><select name="repId">${overdue.map(r=>'<option value="'+r.id+'">'+clientName(r.client_id)+' — '+(r.loan_ref||'')+' ('+peso(r.amount_due)+')</option>').join('')}</select></div>`, async (data,close)=>{
      const {error} = await sb.from('repayments').update({status:'Paid', paid_date:new Date().toISOString()}).eq('id', data.repId);
      if(dbErr(error)) return; showToast('Collection recorded'); close(); await fetchTable('repayments'); renderAll();
    }, 'Record collection');
  });
}

/* ============================================================
   RISK & ALERTS — pulled from the server-side v_risk_alerts view
   ============================================================ */
async function renderRisk(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="panel">Loading live alerts…</div>`;
  const {data, error} = await sb.from('v_risk_alerts').select('*').order('detected',{ascending:false});
  if(dbErr(error)) return;
  const alerts = branchFilter ? data.filter(a=> (a.related||'').startsWith((state.settings.app_prefix||'CBC')) ) : data; // branch filtering handled server-side via applications join in a fuller version
  c.innerHTML = wsHeader('Risk control center','Risk & exception alerts','Resolve policy exceptions, overdue decisions, and portfolio risk signals. Computed server-side.','Export alert log', data.length, data.filter(a=>a.priority==='High').length);
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Open alert register</h2></div><p class="sub">Live from the database view <code>v_risk_alerts</code>.</p>
  <table><thead><tr><th>Priority</th><th>Alert</th><th>Related</th><th>Owner</th><th>Detected</th></tr></thead>
  <tbody>${data.length ? data.map(a=>`<tr><td><span class="badge ${a.priority==='High'?'risk':a.priority==='Medium'?'warn':'neutral'}">${a.priority}</span></td><td>${a.message}</td><td>${a.related||'—'}</td><td>${a.owner||'—'}</td><td>${fmtDate(a.detected)}</td></tr>`).join('') : '<tr class="empty-row"><td colspan="5">No open alerts.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="exportAlerts"]').addEventListener('click',()=>{
    downloadCSV('risk-alerts.csv', [['Priority','Alert','Related','Owner','Detected'], ...data.map(a=>[a.priority,a.message,a.related,a.owner,fmtDate(a.detected)])]);
    showToast('Alert log exported');
  });
}
function wsHeader(eyebrow,title,desc,actionLabel,queueCount,attentionCount){
  const map = {'Assign evaluator':'assignEval','Run scorecard':'runScorecard','Open checklist':'openChecklist','Open decision queue':'openQueue','Create disbursement':'createDisb','Record collection':'recordColl','Export alert log':'exportAlerts'};
  return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><button class="btn primary" data-action="${map[actionLabel]}">${ic('plus')} ${actionLabel}</button></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;"><div class="kpi"><div class="lbl">Work queue</div><div class="val">${queueCount}</div></div><div class="kpi"><div class="lbl">Requires attention</div><div class="val">${attentionCount}</div></div><div class="kpi"><div class="lbl">Performance</div><div class="val">${queueCount?Math.round(((queueCount-attentionCount)/queueCount)*100):100}%</div></div></div>`;
}

    <div class="field" style="margin-top:10px;"><label>Remind before due date (days)</label><input id="tDueDays" type="number" value="${s.notify_due_days}" style="max-width:120px;"></div></div>`;

    document.getElementById('tOverdue').addEventListener('click', async ()=>{ const {error}=await sb.from('settings').update({notify_overdue:!s.notify_overdue}).eq('id',1); if(dbErr(error))return; await fetchTable('settings'); renderSettings(); });
