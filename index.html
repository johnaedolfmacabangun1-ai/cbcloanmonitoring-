function renderApproval(){
  const isAdmin = currentProfile && currentProfile.role==='Administrator';
  let rows = filteredApplications().filter(a=>a.stage==='Approving Authority Review');
  let decided = filteredApplications().filter(a=>['Approved','Differed','Disapproved'].includes(a.stage));
  if(!isAdmin && currentUser){
    rows = rows.filter(a=>a.approving_authority_id===currentUser.id);
    decided = decided.filter(a=>a.approving_authority_id===currentUser.id);
  }
  const c = document.getElementById('content');
  c.innerHTML = wsHeader('Approving authority','Approving Authority',isAdmin?'Check each endorsed case and decide: Approve, Differ (defer for more information), or Disapprove.':'Cases endorsed specifically to you. Check the full BCRRS results, edit if needed, then decide.','Open decision queue', rows.length, 0);
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Awaiting decision</h2></div><p class="sub">Live across ${branchFilter?branchName(branchFilter):'all branches'}.</p>
  <table><thead><tr><th>Application</th><th>Applicant</th><th>Loan amount</th><th>BCRRS score</th><th>Cash flow capacity</th><th>Endorsed by</th><th></th></tr></thead>
  <tbody>${rows.length ? rows.map(a=>{
    const s=scoreFor(a.id); const ev=evalFor(a.id); const band = s?bcrrsBandFor(Number(s.score)):null;
    const exceeds = s && s.max_loan_amount!=null && Number(a.amount) > Number(s.max_loan_amount);
    const approverProfile = currentProfile;
    const overOwnLimit = !isAdmin && approverProfile && approverProfile.approval_limit!=null && Number(a.amount) > Number(approverProfile.approval_limit);
    return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td>${peso(a.amount)}${overOwnLimit?'<div><span class="badge risk">Exceeds your limit ('+peso(approverProfile.approval_limit)+')</span></div>':''}</td><td>${band?Number(s.score).toFixed(2)+' — <span class="badge '+band.cls+'">'+s.decision+'</span>':'Not scored'}</td><td>${s&&s.max_loan_amount!=null?(exceeds?'<span class="badge risk">Exceeds '+peso(s.max_loan_amount)+'</span>':'<span class="badge ok">Within '+peso(s.max_loan_amount)+'</span>'):'—'}</td><td>${ev?ev.assigned_to:'—'}</td><td style="display:flex;gap:6px;flex-wrap:wrap;">${s?`<button class="btn sm" data-viewbcrrs="${a.id}">${ic('report')} BCRRS results</button><button class="btn sm" data-printbcrrs="${a.id}">${ic('report')} Print</button>`:''}<button class="btn sm primary" data-decide="${a.id}" data-outcome="Approved" ${overOwnLimit?'disabled title="Exceeds your approval limit"':''}>Approve</button> <button class="btn sm" data-decide="${a.id}" data-outcome="Differed">Differ</button> <button class="btn sm danger" data-decide="${a.id}" data-outcome="Disapproved">Disapprove</button></td></tr>`;
  }).join('') : '<tr class="empty-row"><td colspan="7">No cases awaiting decision.</td></tr>'}</tbody></table></div>`;
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Recent decisions</h2></div><p class="sub">Latest 8 — Approved, Differed, or Disapproved.</p>
  <table><thead><tr><th>Application</th><th>Applicant</th><th>Decision</th><th>Remarks</th><th>Decided</th><th></th></tr></thead>
  <tbody>${decided.slice(0,8).map(a=>{ const cls = a.stage==='Disapproved'?'risk':a.stage==='Differed'?'warn':'ok'; return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td><span class="badge ${cls}">${a.stage}</span></td><td style="font-size:12px;color:var(--ink-soft);">${a.decision_remarks||'—'}</td><td>${fmtDate(a.stage_entered_at)}</td><td>${a.stage==='Approved'?`<button class="btn sm primary" data-printcp="${a.id}">${ic('report')} Print Credit Proposal</button>`:''}</td></tr>`; }).join('') || '<tr class="empty-row"><td colspan="6">No decisions yet.</td></tr>'}</tbody></table></div>`;
  c.querySelectorAll('[data-printbcrrs]').forEach(b=>b.addEventListener('click',()=>printEvaluationReport(b.dataset.printbcrrs)));
  c.querySelectorAll('[data-printcp]').forEach(b=>b.addEventListener('click',()=>printCreditProposal(b.dataset.printcp)));
  c.querySelectorAll('[data-decide]').forEach(b=>{ if(!b.disabled) b.addEventListener('click',()=>modalDecision(b.dataset.decide, b.dataset.outcome)); });
  c.querySelectorAll('[data-viewbcrrs]').forEach(b=>b.addEventListener('click',()=>modalViewBCRRS(b.dataset.viewbcrrs)));
  document.querySelector('[data-action="openQueue"]').addEventListener('click',()=>showToast(rows.length+' case(s) awaiting decision'));
}
function modalViewBCRRS(appId){
  const a = state.applications.find(x=>x.id===appId); if(!a) return;
  const s = scoreFor(appId); if(!s){ showToast('No scorecard for this application'); return; }
  const band = bcrrsBandFor(Number(s.score));
  const catKeys = ['character','capacity','collateral','condition','capital'];
  const ov = s.category_overrides || {};
  const cats = [['Character (25%)',s.character_score],['Capacity (25%)',s.capacity_score],['Collateral (15%)',s.collateral_score],['Condition of Project (20%)',s.condition_score],['Capital (15%)',s.capital_score]];
  const cf = s.cashflow||{};
  const row = (label,val)=>`<div class="row" style="padding:3px 0;font-size:12.5px;"><span style="color:var(--ink-soft);">${label}:</span> ${val??'—'}</div>`;
  const grid = rows => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;">${rows}</div>`;
  let body = `<div class="mini-note" style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;">${a.code} — ${a.applicant_name} — ${peso(a.amount)} — Purpose: <b>${s.loan_purpose||'—'}</b></div>
  <div class="form-section" style="margin-top:0;padding-top:0;border-top:none;"><h4><span class="num">1</span>Overall result</h4>${grid(
    row('Total risk score','<b>'+Number(s.score).toFixed(4)+'</b>')+row('Risk classification','<span class="badge '+band.cls+'">'+s.risk_band+'</span>')+
    row('Rating assessment','<b>'+s.decision+'</b>')+row('Debt Burden Ratio',s.dti+'%')
  )}</div>
  <div class="form-section"><h4><span class="num">2</span>Category breakdown</h4><table class="mini-table"><thead><tr><th>Category</th><th>Weighted score (of 10)</th><th>Source</th></tr></thead><tbody>
  ${cats.map(([n,v],i)=>`<tr><td>${n}</td><td>${v!=null?Number(v).toFixed(4):'—'}</td><td>${ov[catKeys[i]]!=null?'<span class="badge warn">Manual override ('+ov[catKeys[i]]+')</span>':'Computed from factors'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="form-section"><h4><span class="num">3</span>Cash flow &amp; debt capacity</h4>${grid(
    row('Salary',peso(cf.salary))+row('Business income',peso(cf.business_income))+row('Other income',peso(cf.other_income))+
    row('Existing loan amortization',peso(cf.existing_loan))+row('Net Disposable Income',peso(s.ndi))+
    row('Maximum loan amount','<b>'+peso(s.max_loan_amount)+'</b>')+row('Amount requested',peso(a.amount))+
    row('Within capacity?', Number(a.amount)<=Number(s.max_loan_amount||0)?'Yes':'No — exceeds capacity')
  )}</div>`;
  openModal('BCRRS results — '+a.code, body, (d,close)=>close(), 'Close', true);
  // add Edit + Print actions next to the close button
  setTimeout(()=>{
    const foot = document.querySelector('.modal-foot');
    if(!foot) return;
    const editBtn = document.createElement('button'); editBtn.type='button'; editBtn.className='btn'; editBtn.textContent='Edit scorecard';
    editBtn.addEventListener('click', ()=>{ document.getElementById('modalRoot').innerHTML=''; modalRunScorecard(appId); });
    const printBtn = document.createElement('button'); printBtn.type='button'; printBtn.className='btn'; printBtn.textContent='Print report';
    printBtn.addEventListener('click', ()=>printEvaluationReport(appId));
    foot.insertBefore(printBtn, foot.lastElementChild);
    foot.insertBefore(editBtn, foot.lastElementChild);
  },0);
}
function modalDecision(appId, outcome){
  const a = state.applications.find(x=>x.id===appId);
  const labels = {Approved:'Approve this application',Differed:'Differ this application (defer for more information)',Disapproved:'Disapprove this application'};
  const deductionFields = outcome==='Approved' ? `
    <div class="form-section"><h4><span class="num">2</span>Deductions (for the Credit Proposal form)</h4>
      <div class="field-row3">
        <div class="field"><label>Notarial fee (₱)</label><input name="notarialFee" type="number" step="0.01" value="0"></div>
        <div class="field"><label>Filing / other charges (₱)</label><input name="filingFee" type="number" step="0.01" value="0"></div>
        <div class="field"><label>Insurance (₱)</label><input name="insuranceFee" type="number" step="0.01" value="0"></div>
      </div>
    </div>` : '';
  openModal(labels[outcome]||'Decision', `<div class="mini-note" style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;">${a.code} — ${a.applicant_name} — ${peso(a.amount)}</div>
  <div class="form-section" style="margin-top:0;padding-top:0;border-top:none;"><h4><span class="num">1</span>Decision</h4><div class="field"><label>Remarks${outcome!=='Approved'?'*':''}</label><textarea name="remarks" rows="3" placeholder="Reason / notes for this decision"${outcome!=='Approved'?' required':''}></textarea></div></div>${deductionFields}`, async (data,close)=>{
    const update = {stage:outcome, stage_entered_at:new Date().toISOString(), decision_remarks:data.remarks||''};
    if(outcome==='Approved'){ update.notarial_fee=Number(data.notarialFee||0); update.filing_fee=Number(data.filingFee||0); update.insurance_fee=Number(data.insuranceFee||0); }
    const {error} = await sb.from('applications').update(update).eq('id', appId);
    if(dbErr(error)) return;
    showToast('Application '+outcome.toLowerCase()+(outcome==='Approved'?' — Credit Proposal ready to print':'')); close(); await fetchTable('applications'); renderAll();
  }, labels[outcome]||'Confirm', outcome==='Approved');
}

function printEvaluationReport(appId){
  const a = state.applications.find(x=>x.id===appId); if(!a) return;
  const s = scoreFor(appId); if(!s){ showToast('No scorecard has been run for this application yet'); return; }
  const band = bcrrsBandFor(Number(s.score));

function printCreditProposal(appId){
  const a = state.applications.find(x=>x.id===appId); if(!a) return;
  const cl = state.clients.find(c=>c.id===a.client_id) || {};
  const pi = cl.personal_info||{}, fi = cl.financial_info||{}, si = cl.spouse_info||{};
  const product = state.products.find(p=>p.id===a.product_id) || {};
  const s = scoreFor(appId);
  const cf = (s && s.cashflow) || {};
  const collateralDocs = state.documents.filter(d=>d.application_id===appId && d.category==='Collateral');
  const appr = appraisalFor(appId);

  const notarial = Number(a.notarial_fee||0), filing = Number(a.filing_fee||0), insurance = Number(a.insurance_fee||0);
  const financialCharges = notarial + filing;
  const totalDeduction = financialCharges + insurance;
  const loanProceeds = Number(a.amount) - totalDeduction;

  const income = Number(cf.salary||0)+Number(cf.business_income||0)+Number(cf.other_income||0);
  const expenses = Number(cf.food_groceries||0)+Number(cf.utilities||0)+Number(cf.transportation||0)+Number(cf.education||0)+Number(cf.other_household||0)+Number(cf.existing_loan||0);
  const netIncome = s ? Number(s.ndi) : (income-expenses);
  const availDebtService = netIncome;
  const adjCapacity = availDebtService*0.7;

  const row = (label,val)=>`<tr><td style="color:#68746E;width:32%;">${label}</td><td>${val??'—'}</td></tr>`;
  const twoCol = (label1,val1,label2,val2)=>`<tr><td style="color:#68746E;width:26%;">${label1}</td><td style="width:24%;">${val1??'—'}</td><td style="color:#68746E;width:26%;">${label2}</td><td>${val2??'—'}</td></tr>`;

  const band = s ? bcrrsBandFor(Number(s.score)) : null;

  const body = `
  <h1>Credit Proposal</h1>
  <div class="meta">Printed ${new Date().toLocaleString('en-PH')} — Application ${a.code} — Status: <b>${a.stage}</b></div>

  <h2>Background — Personal Data</h2>
  <table><tbody>
  ${twoCol('Applicant', cl.name||a.applicant_name, 'Spouse', [si.first_name,si.middle_name,si.last_name].filter(Boolean).join(' ')||'—')}
  ${twoCol('Birthdate', pi.birthdate||'—', 'Spouse Birthdate', si.birthdate||'—')}
  ${twoCol('Civil Status', pi.civil_status||'—', 'Highest Educational Attainment', si.education||'—')}
  ${twoCol('Address', pi.present_address||'—', 'Contact Number', pi.mobile_phone||'—')}
  </tbody></table>

  <h2>Primary Source of Income</h2>
  <table><tbody>
  ${fi.employer_name ? row('Employer', fi.employer_name) : row('Business Name', fi.business_name||'—')}
  ${row('Address', fi.employer_address||fi.business_address||'—')}
  ${row('Kind / Nature', fi.nature_of_business||fi.position||'—')}
  ${row('Estimated Monthly Income', cf.salary?peso(cf.salary):(fi.annual_income||'—'))}
  </tbody></table>

  <h2>Purpose</h2>
  <table><tbody>
  ${row('Loan Purpose', (s&&s.loan_purpose)||'—')}
  ${twoCol('Amount Applied', peso(a.amount), 'Amount Recommended', peso(a.amount))}
  </tbody></table>

  <h2>Existing Facilities</h2>
  <table><tbody>
  ${twoCol('Loan Product', product.name||'—', 'Mode of Payment', a.payment_mode||'—')}
  ${twoCol('Security Type', a.security_type||'Unsecured', 'Term', (product.term||'—')+' months')}
  ${twoCol('Contracted Rate', product.rate?(product.rate+'%/month'):'—', 'Collateral Type', a.collateral_type||'—')}
  </tbody></table>

  <h2>Loan Structure</h2>
  <table><tbody>
  ${row('Loan Amount', peso(a.amount))}
  ${row('Less: Notarial Fee', peso(notarial))}
  ${row('Less: Filing / Other Charges', peso(filing))}
  ${row('Less: Insurance', peso(insurance))}
  <tr style="font-weight:700;"><td>Total Deduction</td><td>${peso(totalDeduction)}</td></tr>
  <tr style="font-weight:700;"><td>Loan Proceeds</td><td>${peso(loanProceeds)}</td></tr>
  </tbody></table>

  <h2>Financial Forecast (monthly)</h2>
  <table><tbody>
  ${row('Primary Source of Income', peso(income))}
  ${row('Expenses (business + household + existing loans)', peso(expenses))}
  <tr style="font-weight:700;"><td>Net Business &amp; Household Income</td><td>${peso(netIncome)}</td></tr>
  </tbody></table>

  <h2>Debt Capacity Analysis</h2>
  <table><tbody>
  ${row('Amount Available for Debt Service', peso(availDebtService))}
  ${row('Adjusted Debt Capacity @ 70%', peso(adjCapacity))}
  <tr style="font-weight:700;"><td>Maximum Loan Amount</td><td>${s&&s.max_loan_amount!=null?peso(s.max_loan_amount):'—'}</td></tr>
  </tbody></table>

  <h2>Risks Analysis — Security Details</h2>
  <table><tbody>
  ${row('Security', (a.security_type||'Unsecured')+(a.collateral_type?' — '+a.collateral_type:''))}
  ${row('Supporting collateral documents', collateralDocs.length?collateralDocs.map(d=>d.file_name||d.doc_name).join('; '):'None uploaded')}
  ${appr ? row('Appraised Fair Market Value', peso(appr.market_value)) : ''}
  ${appr ? row('Appraised Loanable Value ('+appr.loanable_pct+'%)', peso(appr.loanable_value)) : ''}
  ${appr ? row('Appraisal Recommendation', appr.recommendation||'—') : (a.security_type==='Secured' ? row('Appraisal', 'Not yet appraised — see Document Center') : '')}
  </tbody></table>

  <h2>Borrower's Credit Risk Rating System (BCRRS)</h2>
  ${s ? `<table><tbody>
  ${row('Purpose used for Condition of Project', s.loan_purpose||'—')}
  ${row('Character (25%)', Number(s.character_score).toFixed(4))}
  ${row('Capacity (25%)', Number(s.capacity_score).toFixed(4))}
  ${row('Collateral (15%)', Number(s.collateral_score).toFixed(4))}
  ${row('Condition of Project (20%)', Number(s.condition_score).toFixed(4))}
  ${row('Capital (15%)', Number(s.capital_score).toFixed(4))}
  <tr style="font-weight:700;"><td>TOTAL RATING ASSESSMENT AND RISK SCORE</td><td>${Number(s.score).toFixed(4)}</td></tr>
  <tr style="font-weight:700;"><td>FINAL RATING ASSESSMENT AND RISK SCORE</td><td>${band.label} / ${s.decision}</td></tr>
  </tbody></table>` : `<p style="color:#68746E;">No BCRRS scorecard was recorded for this application.</p>`}

  <h2>Conclusions / Recommendations</h2>
  <p style="min-height:50px;border-bottom:1px solid #E4E7E3;padding-bottom:8px;">${a.decision_remarks||'&nbsp;'}</p>

  <div class="meta" style="margin-top:32px;display:flex;justify-content:space-between;">
    <div>Prepared by: ______________________<br>Evaluation Staff</div>
    <div>Endorsed by: ______________________<br>Evaluation Staff</div>
    <div>Approved by: ______________________<br>${a.approving_authority_name||'Approving Authority'}</div>
  </div>`;
  printWindow('Credit Proposal — '+a.code, body);
}

/* ============================================================
   COLLATERAL APPRAISAL — REM & Chattel, mirrors the bank's own
   appraisal templates (data entry + real valuation formulas)
   ============================================================ */
function ensureSecuredAppraisalEntry(appId, collateralType){
  // ← Accept collateralType as parameter to avoid state lookup timing issues
  if(!appId || !collateralType) return Promise.resolve();

  const existing = state.appraisals.find(x => x.application_id === appId);
  if(existing) return Promise.resolve(existing);

  const basePayload = {
    application_id: appId,
    collateral_type: collateralType || 'Real Estate Mortgage (REM)',
    appraiser_name: '',
    inspection_date: null,
    fields: {},
    market_value: 0,
    loanable_value: 0,
    loanable_pct: (collateralType || '').includes('Real Estate') ? 60 : 50,
    recommendation: 'Deferred',
    remarks: 'Pending collateral appraisal',
    created_by: currentUser ? currentUser.id : null,
  };

  return sb.from('collateral_appraisals').insert(basePayload).then(({data, error}) => {
    if(error){ dbErr(error); return null; }
    if(!error && data && data.length){ state.appraisals.unshift(data[0]); return data[0]; }
    if(!error && data){ state.appraisals.unshift(data); return data; }
    return null;
  });
}

function modalCollateralDocs(appId){
  const docs = state.documents.filter(d => d.application_id === appId && ['Collateral','Appraisal'].includes(d.category));
  const app = state.applications.find(x => x.id === appId);
  if(!docs.length){
    openModal('Collateral documents', `<p style="color:var(--ink-soft);font-size:13px;">No collateral or appraisal files were uploaded for ${app ? app.applicant_name : 'this loan'} yet.</p>`, (d,close)=>close(), 'Close');
    return;
  }

  const html = docs.map(doc => `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="flex:1;min-width:0;">
        <div style="font-size:12.8px;font-weight:600;">${doc.doc_name || doc.file_name || 'Collateral document'}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;">${doc.file_name || 'Uploaded file'} • ${doc.category || 'Collateral'}</div>
      </div>
      <a class="btn sm" href="${doc.file_url || '#'}" target="_blank" rel="noopener">View</a>
    </div>
  `).join('');

  openModal('Collateral documents — '+(app ? app.applicant_name : 'Application'), html, (d,close)=>close(), 'Close', true);
}

  <tbody>${rows.length ? rows.map(a=>{
    const appr = appraisalFor(a.id);
    const recCls = appr ? (appr.recommendation==='Recommended'?'ok':appr.recommendation==='Deferred'?'warn':'risk') : 'neutral';
    const collateralDocs = state.documents.filter(d => d.application_id === a.id && ['Collateral','Appraisal'].includes(d.category));
    return `<tr><td>${a.code}</td><td>${a.applicant_name}</td><td>${branchName(a.branch_id)}</td><td>${a.collateral_type||'—'}</td><td>${appr?peso(appr.market_value):'—'}</td><td>${appr?peso(appr.loanable_value):'—'}</td><td><span class="badge ${recCls}">${appr?appr.recommendation:'Not appraised'}</span></td><td style="display:flex;gap:6px;flex-wrap:wrap;">${appr?`<button class="btn sm" data-appraisal="${a.id}">Edit</button><button class="btn sm" data-printappraisal="${a.id}">${ic('report')} Print</button>`:`<button class="btn sm primary" data-appraisal="${a.id}">${ic('plus')} Appraise</button>`}${collateralDocs.length?`<button class="btn sm" data-viewdocs="${a.id}">${ic('folder')} ${collateralDocs.length} doc${collateralDocs.length>1?'s':''}</button>`:'<span class="badge risk">No docs</span>'}</td></tr>`;
  }).join('') : '<tr class="empty-row"><td colspan="8">No Secured applications yet.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="appraiseFirst"]').addEventListener('click', ()=>{
    const target = rows.find(a=>!appraisalFor(a.id)) || rows[0];
    if(!target){ showToast('No Secured applications to appraise yet'); return; }
    modalAppraisal(target.id);
  });
  c.querySelectorAll('[data-appraisal]').forEach(b=>b.addEventListener('click',()=>modalAppraisal(b.dataset.appraisal)));
  c.querySelectorAll('[data-printappraisal]').forEach(b=>b.addEventListener('click',()=>printAppraisal(b.dataset.printappraisal)));
  c.querySelectorAll('[data-viewdocs]').forEach(b=>b.addEventListener('click',()=>modalCollateralDocs(b.dataset.viewdocs)));
}
function modalAppraisal(appId){

      <div class="field"><label>Registration Date</label><input name="registrationDate" type="date" value="${v('registrationDate')}"></div>
    </div>
    <div class="form-section"><h4><span class="num">2</span>Land description</h4>
      <div class="field-row3"><div class="field"><label>Shape</label><input name="shape" value="${v('shape')}"></div><div class="field"><label>Terrain</label><input name="terrain" value="${v('terrain')}"></div><div class="field"><label>Topography</label><input name="topography" value="${v('topography')}"></div></div>
      <div class="field-row"><div class="field"><label>Frontage (meters)</label><input name="frontage" type="number" step="0.01" value="${v('frontage')}"></div><div class="field"><label>Average depth (meters)</label><input name="depth" type="number" step="0.01" value="${v('depth')}"></div></div>
      <div class="field-row"><div class="field"><label>Present use</label><input name="presentUse" value="${v('presentUse')}"></div><div class="field"><label>Zoning classification</label><input name="zoning" value="${v('zoning')}"></div></div>
      <div class="field"><label>Road access / utilities available</label><input name="roadUtilities" placeholder="e.g. concrete road, water, electricity" value="${v('roadUtilities')}"></div>
    </div>
    <div class="form-section"><h4><span class="num">3</span>Land valuation</h4>
      <div class="field-row"><div class="field"><label>Market value per sqm (₱)</label><input name="mvPerSqm" id="apMvPerSqm" type="number" step="0.01" value="${v('mvPerSqm')}"></div><div class="field"><label>Loanable value % (default 60% for REM)</label><input name="landLoanablePct" id="apLandPct" type="number" step="1" value="${v('landLoanablePct',60)}"></div></div>
      <div id="apLandLive" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;"></div>
    </div>
    <div class="form-section"><h4><span class="num">4</span>Improvements (if any)</h4>
      <div class="field"><label>Description of improvements</label><input name="impDesc" value="${v('impDesc')}"></div>
      <div class="field-row3"><div class="field"><label>Area (sqm)</label><input name="impArea" id="apImpArea" type="number" step="0.01" value="${v('impArea',0)}"></div><div class="field"><label>Reproduction cost per sqm (₱)</label><input name="impCostPerSqm" id="apImpCost" type="number" step="0.01" value="${v('impCostPerSqm',0)}"></div><div class="field"><label>Depreciation (%)</label><input name="impDeprPct" id="apImpDepr" type="number" step="0.1" value="${v('impDeprPct',0)}"></div></div>
      <div id="apImpLive" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;"></div>
    </div>
    <div class="form-section"><h4><span class="num">5</span>Title verification</h4>
      <div class="field-row"><div class="field"><label>Preceding Title No.</label><input name="precedingTitle" value="${v('precedingTitle')}"></div><div class="field"><label>OCT No.</label><input name="octNo" value="${v('octNo')}"></div></div>
      <div class="field"><label>Technical description / metes and bounds</label><textarea name="technicalDesc" rows="3" placeholder="Boundary description, e.g. bounded on the North by Lot X owned by Y...">${v('technicalDesc')}</textarea></div>
      <div class="mini-note">Annotations / encumbrances found on the title (up to 3):</div>
      <table class="mini-table"><thead><tr><th>Entry No.</th><th>Details</th><th>Date of Instrument</th><th>Date of Inscription</th></tr></thead>
      <tbody>${[1,2,3].map(i=>`<tr><td><input name="annEntry${i}" value="${v('annEntry'+i)}"></td><td><input name="annDetails${i}" value="${v('annDetails'+i)}"></td><td><input type="date" name="annInstrument${i}" value="${v('annInstrument'+i)}"></td><td><input type="date" name="annInscription${i}" value="${v('annInscription'+i)}"></td></tr>`).join('')}</tbody></table>
    </div>
    <div class="form-section"><h4><span class="num">6</span>Lot plot, maps &amp; photos</h4>
      <div class="mini-note">Attach whatever's available — each uploads to Document Center and appears in the printed report.</div>
      <div class="field"><label>Lot plot / CAD drawing</label><input type="file" name="fileLotPlot"></div>
      <div class="field"><label>Tax map</label><input type="file" name="fileTaxMap"></div>
      <div class="field"><label>Location map</label><input type="file" name="fileLocationMap"></div>
      <div class="field"><label>Title (TCT) copy</label><input type="file" name="fileTitleCopy"></div>
      <div class="field"><label>Tax declaration copy</label><input type="file" name="fileTaxDec"></div>
      <div class="field"><label>Property photos (multiple)</label><input type="file" name="filePhotos" multiple></div>
    </div>`;
  } else {
    bodyHTML += `
    <div class="form-section"><h4><span class="num">1</span>Vehicle / chattel details</h4>
      <div class="field-row3"><div class="field"><label>Year model</label><input name="yearModel" value="${v('yearModel')}"></div><div class="field"><label>Make</label><input name="make" value="${v('make')}"></div><div class="field"><label>Series / Body type</label><input name="series" value="${v('series')}"></div></div>
      <div class="field-row3"><div class="field"><label>Engine / Motor No.</label><input name="engineNo" value="${v('engineNo')}"></div><div class="field"><label>Chassis / Serial No.</label><input name="chassisNo" value="${v('chassisNo')}"></div><div class="field"><label>Plate No.</label><input name="plateNo" value="${v('plateNo')}"></div></div>
      <div class="field-row"><div class="field"><label>OR No.</label><input name="orNo" value="${v('orNo')}"></div><div class="field"><label>CR No.</label><input name="crNo" value="${v('crNo')}"></div></div>
    </div>
    <div class="form-section"><h4><span class="num">2</span>Valuation — straight-line depreciation</h4>
      <div class="field-row3"><div class="field"><label>Acquisition cost / RCN (₱)</label><input name="acqCost" id="apAcqCost" type="number" step="0.01" value="${v('acqCost',0)}"></div><div class="field"><label>Estimated useful life (years)</label><input name="usefulLife" id="apUsefulLife" type="number" step="0.1" value="${v('usefulLife',10)}"></div><div class="field"><label>Effective age / years used</label><input name="effectiveAge" id="apEffectiveAge" type="number" step="0.1" value="${v('effectiveAge',0)}"></div></div>
      <div class="field"><label>Second-hand re-sale value, for comparison (₱, optional)</label><input name="resaleValue" id="apResale" type="number" step="0.01" value="${v('resaleValue','')}"></div>
      <div id="apChattelLive" style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;"></div>
      <div class="field" style="margin-top:10px;"><label>Loanable value % (default 50% for Chattel)</label><input name="chattelLoanablePct" id="apChattelPct" type="number" step="1" value="${v('chattelLoanablePct',50)}"></div>
    </div>`;
  }

  bodyHTML += `<div class="form-section"><h4><span class="num">5</span>Recommendation</h4>
    <div class="field-row"><div class="field"><label>Appraiser name</label><input name="appraiserName" value="${existing?existing.appraiser_name||'':( (currentProfile&&currentProfile.full_name)||'')}"></div><div class="field"><label>Date of inspection</label><input name="inspectionDate" type="date" value="${existing&&existing.inspection_date?existing.inspection_date:new Date().toISOString().slice(0,10)}"></div></div>
    <div class="field"><label>Recommendation</label><select name="recommendation"><option ${existing&&existing.recommendation==='Recommended'?'selected':''}>Recommended</option><option ${existing&&existing.recommendation==='Not Recommended'?'selected':''}>Not Recommended</option><option ${existing&&existing.recommendation==='Deferred'?'selected':''}>Deferred</option></select></div>
    <div class="field"><label>Remarks</label><textarea name="remarks" rows="3">${existing?existing.remarks||'':''}</textarea></div>
  </div>`;

  openModal(existing?'Edit collateral appraisal':'Appraise collateral', bodyHTML, async (data,close)=>{
    const FILE_KEYS = ['fileLotPlot','fileTaxMap','fileLocationMap','fileTitleCopy','fileTaxDec','filePhotos'];
    const dataNoFiles = {...data}; FILE_KEYS.forEach(k=>delete dataNoFiles[k]);
    let market_value, loanable_value, loanable_pct, fields;
    if(isREM){
      const area = Number(data.areaSqm||0), mv = Number(data.mvPerSqm||0), landPct = Number(data.landLoanablePct||60);
      const landMV = area*mv, landLoanable = landMV*(landPct/100);
      const impArea = Number(data.impArea||0), impCost = Number(data.impCostPerSqm||0), impDepr = Number(data.impDeprPct||0);
      const impRCN = impArea*impCost, impFMV = impRCN*(1-impDepr/100), impLoanable = impFMV*(landPct/100);
      market_value = landMV+impFMV; loanable_value = landLoanable+impLoanable; loanable_pct = landPct;
      fields = {...dataNoFiles};
    } else {
      const cost = Number(data.acqCost||0), life = Number(data.usefulLife||1), age = Number(data.effectiveAge||0);

      const deprVal = cost-depr;
      const resale = data.resaleValue!=='' ? Number(data.resaleValue) : null;
      market_value = resale!=null ? (deprVal+resale)/2 : deprVal;
      const chattelPct = Number(data.chattelLoanablePct||50);
      loanable_value = market_value*(chattelPct/100); loanable_pct = chattelPct;
      fields = {...dataNoFiles};
    }

      application_id:appId, collateral_type:a.collateral_type||'Real Estate Mortgage (REM)',
      appraiser_name:data.appraiserName||'', inspection_date:data.inspectionDate||null,
      fields, market_value:Math.round(market_value*100)/100, loanable_value:Math.round(loanable_value*100)/100, loanable_pct,
      recommendation:data.recommendation, remarks:data.remarks||'', created_by:currentUser.id
    };
    let error;
    if(existing){ ({error} = await sb.from('collateral_appraisals').update(payload).eq('id', existing.id)); }
    else { ({error} = await sb.from('collateral_appraisals').insert(payload)); }
    if(dbErr(error)) return;

    // upload any attached maps/plots/title copies/photos into Document Center
    if(isREM){
      const singleUploads = [['fileLotPlot','Lot plot / CAD drawing'],['fileTaxMap','Tax map'],['fileLocationMap','Location map'],['fileTitleCopy','Title (TCT) copy'],['fileTaxDec','Tax declaration copy']];
      for(const [inputName,label] of singleUploads){
        const inp = document.querySelector(`[name="${inputName}"]`);
        if(inp && inp.files && inp.files[0]){
          const up = await uploadFileToStorage('app-'+appId, inp.files[0]);
          if(up.error){ showToast('Upload failed ('+label+'): '+up.error.message); continue; }
          await sb.from('documents').insert({application_id:appId, doc_name:label+' — '+up.name, category:'Appraisal', verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id, file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString()});
        }
      }
      const photosInp = document.querySelector('[name="filePhotos"]');
      if(photosInp && photosInp.files && photosInp.files.length){
        for(const file of photosInp.files){
          const up = await uploadFileToStorage('app-'+appId, file);
          if(up.error){ showToast('Photo upload failed: '+up.error.message); continue; }
          await sb.from('documents').insert({application_id:appId, doc_name:'Property photo — '+up.name, category:'Appraisal', verified:true, verified_at:new Date().toISOString(), verified_by:currentUser.id, file_path:up.path, file_url:up.url, file_name:up.name, uploaded_by:currentUser.id, uploaded_at:new Date().toISOString()});
        }
      }
      await fetchTable('documents');
    }

    showToast('Appraisal saved — Market value '+peso(market_value)+', Loanable value '+peso(loanable_value)); close();
    await fetchTable('appraisals'); renderAll();
  }, existing?'Save changes':'Save appraisal', true);

  setTimeout(()=>{
    if(isREM){
      const recalcLand = ()=>{
        const area=Number(document.getElementById('apAreaSqm').value||0), mv=Number(document.getElementById('apMvPerSqm').value||0), pct=Number(document.getElementById('apLandPct').value||60);
        const landMV=area*mv, landLoanable=landMV*(pct/100);
        document.getElementById('apLandLive').innerHTML = `Land Market Value: <b>${peso(landMV)}</b> &nbsp;·&nbsp; Land Loanable Value (${pct}%): <b>${peso(landLoanable)}</b>`;
      };
      const recalcImp = ()=>{
        const area=Number(document.getElementById('apImpArea').value||0), cost=Number(document.getElementById('apImpCost').value||0), depr=Number(document.getElementById('apImpDepr').value||0);
        const pct=Number(document.getElementById('apLandPct').value||60);
        const rcn=area*cost, fmv=rcn*(1-depr/100), loanable=fmv*(pct/100);
        document.getElementById('apImpLive').innerHTML = `Reproduction Cost New: <b>${peso(rcn)}</b> &nbsp;·&nbsp; Depreciated (FMV): <b>${peso(fmv)}</b> &nbsp;·&nbsp; Loanable Value: <b>${peso(loanable)}</b>`;
      };
      ['apAreaSqm','apMvPerSqm','apLandPct'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{recalcLand();recalcImp();}));
      ['apImpArea','apImpCost','apImpDepr'].forEach(id=>document.getElementById(id).addEventListener('input',recalcImp));
      recalcLand(); recalcImp();
    } else {
      const recalc = ()=>{
        const cost=Number(document.getElementById('apAcqCost').value||0), life=Number(document.getElementById('apUsefulLife').value||1), age=Number(document.getElementById('apEffectiveAge').value||0);
        const resaleRaw = document.getElementById('apResale').value;
        const depr = life>0 ? cost*(age/life) : 0; const deprVal = cost-depr;
        const resale = resaleRaw!=='' ? Number(resaleRaw) : null;
        const mv = resale!=null ? (deprVal+resale)/2 : deprVal;
        const pct = Number(document.getElementById('apChattelPct').value||50);
        document.getElementById('apChattelLive').innerHTML = `Depreciation: <b>${peso(depr)}</b> &nbsp;·&nbsp; Depreciated Value: <b>${peso(deprVal)}</b><br>Reconciled Market Value: <b>${peso(mv)}</b> &nbsp;·&nbsp; Loanable Value (${pct}%): <b>${peso(mv*(pct/100))}</b>`;
      };
      ['apAcqCost','apUsefulLife','apEffectiveAge','apResale','apChattelPct'].forEach(id=>document.getElementById(id).addEventListener('input',recalc));
      recalc();
    }
  },0);
}

    ${[1,2,3].filter(i=>f['annEntry'+i]).map(i=>`<tr><td>${f['annEntry'+i]||'—'}</td><td>${f['annDetails'+i]||'—'}</td><td>${f['annInstrument'+i]?fmtDate(f['annInstrument'+i]):'—'}</td><td>${f['annInscription'+i]?fmtDate(f['annInscription'+i]):'—'}</td></tr>`).join('')}
    </tbody></table>`:''}
    ${(()=>{ const maps = state.documents.filter(d=>d.application_id===appId && d.category==='Appraisal'); return maps.length?`<h2>Attached Maps, Plot &amp; Photos</h2><table><thead><tr><th>Document</th><th>File</th></tr></thead><tbody>${maps.map(d=>`<tr><td>${d.doc_name.split(' — ')[0]}</td><td>${d.file_name||'—'}</td></tr>`).join('')}</tbody></table><p class="meta">Full-resolution copies are available in Document Center.</p>`:''; })()}`;
  } else {

    <h2>Valuation — Straight-line Depreciation</h2><table><tbody>
    ${row('Acquisition Cost / RCN', peso(f.acqCost))}${row('Estimated Useful Life', (f.usefulLife||'—')+' years')}${row('Effective Age', (f.effectiveAge||'—')+' years')}
    ${f.resaleValue?row('Second-hand Re-sale Value (comparison)', peso(f.resaleValue)):''}
    </tbody></table>`;
  }

  body += `<h2>Reconciliation of Value</h2><table><tbody>
  <tr style="font-weight:700;"><td>Fair Market Value</td><td>${peso(appr.market_value)}</td></tr>
  <tr style="font-weight:700;"><td>Loanable Value (${appr.loanable_pct}%)</td><td>${peso(appr.loanable_value)}</td></tr>
  </tbody></table>
  <h2>Remarks &amp; Recommendation</h2>
  <p>${appr.remarks||'&nbsp;'}</p>
  <p><b>Recommendation: ${appr.recommendation||'—'}</b></p>
  <div class="meta" style="margin-top:32px;display:flex;justify-content:space-between;">
    <div>Prepared by: ______________________<br>${appr.appraiser_name||'Appraiser'}</div>
    <div>Approved by: ______________________<br>Loans Department Head</div>
    <div>Noted by: ______________________<br>Chief Operating Officer</div>
  </div>`;
  printWindow((isREM?'Appraisal Report':'Field Appraisal Sheet')+' — '+a.code, body);
}

/* ============================================================
   RISK & ALERTS — pulled from the server-side v_risk_alerts view
   ============================================================ */
async function renderRisk(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="panel">Loading live alerts…</div>`;
  const {data, error} = await sb.from('v_risk_alerts').select('*').order('detected',{ascending:false});
  if(dbErr(error)) return;
  const alerts = branchFilter ? data.filter(a=> (a.related||'').startsWith((state.settings.app_prefix||'CBC')) ) : data; // branch filtering handled server-side via applications join in a fuller version
  c.innerHTML = wsHeader('Risk control center','Risk & exception alerts','Resolve policy exceptions, overdue decisions, and portfolio risk signals. Computed server-side.','Export alert log', data.length, data.filter(a=>a.priority==='High').length);
  c.innerHTML += `<div class="panel"><div class="panel-head"><h2>Open alert register</h2></div><p class="sub">Live from the database view <code>v_risk_alerts</code>.</p>
  <table><thead><tr><th>Priority</th><th>Alert</th><th>Related</th><th>Owner</th><th>Detected</th></tr></thead>
  <tbody>${data.length ? data.map(a=>`<tr><td><span class="badge ${a.priority==='High'?'risk':a.priority==='Medium'?'warn':'neutral'}">${a.priority}</span></td><td>${a.message}</td><td>${a.related||'—'}</td><td>${a.owner||'—'}</td><td>${fmtDate(a.detected)}</td></tr>`).join('') : '<tr class="empty-row"><td colspan="5">No open alerts.</td></tr>'}</tbody></table></div>`;
  document.querySelector('[data-action="exportAlerts"]').addEventListener('click',()=>{
    downloadCSV('risk-alerts.csv', [['Priority','Alert','Related','Owner','Detected'], ...data.map(a=>[a.priority,a.message,a.related,a.owner,fmtDate(a.detected)])]);
    showToast('Alert log exported');
  });
}
function wsHeader(eyebrow,title,desc,actionLabel,queueCount,attentionCount){
  const map = {'Assign evaluator':'assignEval','Run scorecard':'runScorecard','Open checklist':'openChecklist','Open decision queue':'openQueue','Export alert log':'exportAlerts','Appraise collateral':'appraiseFirst'};
  return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><button class="btn primary" data-action="${map[actionLabel]}">${ic('plus')} ${actionLabel}</button></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;"><div class="kpi"><div class="lbl">Work queue</div><div class="val">${queueCount}</div></div><div class="kpi"><div class="lbl">Requires attention</div><div class="val">${attentionCount}</div></div><div class="kpi"><div class="lbl">Performance</div><div class="val">${queueCount?Math.round(((queueCount-attentionCount)/queueCount)*100):100}%</div></div></div>`;
}

/* ============================================================
   BRANCHES
   ============================================================ */
function renderBranches(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="page-head"><div><h1>Branches</h1><p>Manage locations and branch operating status.</p></div><button class="btn primary" data-action="addBranch">${ic('plus')} Add branch</button></div>
  <div class="two-col" style="grid-template-columns:repeat(2,1fr);">${state.branches.map(b=>`<div class="panel"><div style="display:flex;justify-content:space-between;"><div class="ic" style="width:34px;height:34px;border-radius:8px;background:var(--ok-bg);color:var(--ok-ink);display:flex;align-items:center;justify-content:center;">${ic('landmark')}</div><span class="badge ok">${b.status}</span></div>
  <h3 style="color:var(--blue);margin:12px 0 4px;font-size:15px;">${b.name}</h3><p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 10px;">${b.address||''}</p>
  <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);"><span>${b.phone||''}</span><button class="btn sm" data-editbranch="${b.id}">Manage →</button></div></div>`).join('') || '<p>No branches yet.</p>'}</div>`;
  document.querySelector('[data-action="addBranch"]').addEventListener('click',()=>{
    openModal('Add branch', `<div class="field"><label>Branch name</label><input name="name" required></div><div class="field"><label>Address</label><input name="address" required></div><div class="field"><label>Contact number</label><input name="phone"></div>`, async (data,close)=>{
      const {error} = await sb.from('branches').insert({name:data.name, address:data.address, phone:data.phone});
      if(dbErr(error)) return; showToast('Branch added'); close(); await fetchTable('branches'); renderAll();
    }, 'Add branch');
  });
  c.querySelectorAll('[data-editbranch]').forEach(b=>b.addEventListener('click',()=>{
    const br = state.branches.find(x=>x.id===b.dataset.editbranch);
    openModal('Manage branch', `<div class="field"><label>Branch name</label><input name="name" value="${br.name}" required></div><div class="field"><label>Address</label><input name="address" value="${br.address||''}" required></div><div class="field"><label>Contact number</label><input name="phone" value="${br.phone||''}"></div><div class="field"><label>Status</label><select name="status"><option ${br.status==='Active'?'selected':''}>Active</option><option ${br.status==='Inactive'?'selected':''}>Inactive</option></select></div>`, async (data,close)=>{
      const {error} = await sb.from('branches').update({name:data.name, address:data.address, phone:data.phone, status:data.status}).eq('id', br.id);
      if(dbErr(error)) return; showToast('Branch updated'); close(); await fetchTable('branches'); renderAll();
    }, 'Save changes');
  }));
}

/* ============================================================
   USERS & ROLES
   ============================================================ */
function renderUsers(){
  const c = document.getElementById('content');
  const isAdmin = currentProfile && currentProfile.role==='Administrator';
  c.innerHTML = `<div class="page-head"><div><h1>Users &amp; roles</h1><p>Control system access, module permissions, and the Approving Authority roster.</p></div></div>
  <div class="panel"><p class="sub">Staff accounts are created in Supabase Authentication (invite-only). Once someone signs in for the first time, their profile appears here — set their role, branch, module access, and (Administrators only) Approving Authority status below.</p>
  <table><thead><tr><th>User</th><th>Role</th><th>Branch</th><th>Access</th><th>Approving Authority</th><th>Status</th><th></th></tr></thead>
  <tbody>${state.profiles.length ? state.profiles.map(u=>{
    const customized = u.permissions && typeof u.permissions==='object' && Object.keys(u.permissions).length;
    const accessLabel = u.role==='Administrator' ? 'Full access' : customized ? 'Custom' : 'No access yet';
    const aaLabel = u.is_approving_authority ? ('Up to '+(u.approval_limit!=null?peso(u.approval_limit):'any amount')) : '—';
    return `<tr><td>${u.full_name}</td><td>${u.role}</td><td>${branchName(u.branch_id)}</td><td><span class="badge ${u.role==='Administrator'?'ok':customized?'warn':'risk'}">${accessLabel}</span></td><td>${u.is_approving_authority?`<span class="badge ok">${aaLabel}</span>`:'<span class="badge neutral">—</span>'}</td><td><span class="badge ok">${u.status}</span></td><td style="display:flex;gap:6px;"><button class="btn sm" data-edituser="${u.id}">Edit</button>${isAdmin?`<button class="btn sm" data-access="${u.id}">${ic('shield')} Access</button>`:''}</td></tr>`;
  }).join('') : '<tr class="empty-row"><td colspan="7">No staff have signed in yet.</td></tr>'}</tbody></table></div>`;
  c.querySelectorAll('[data-edituser]').forEach(b=>b.addEventListener('click',()=>{
    const u = state.profiles.find(x=>x.id===b.dataset.edituser);
    const aaFieldsHTML = isAdmin ? `
    <div class="form-section"><h4><span class="num">A</span>Approving Authority (Administrator only)</h4>
      <div class="toggle-row"><div><div class="t">Eligible as Approving Authority</div><div class="d">Appears as a routing option when Evaluation Staff endorse a scored application</div></div><button type="button" class="switch ${u.is_approving_authority?'on':''}" id="euAaToggle"><span class="knob"></span></button></div>
      <input type="hidden" name="isApprovingAuthority" id="euAaHidden" value="${u.is_approving_authority?'1':''}">
      <div class="field"><label>Approval limit (₱) — maximum loan amount this person can approve. Leave blank for no limit.</label><input name="approvalLimit" type="number" step="1000" value="${u.approval_limit!=null?u.approval_limit:''}"></div>
    </div>` : '';
    openModal('Edit user', `<div class="field"><label>Full name</label><input name="fullName" value="${u.full_name}" required></div>
    <div class="field"><label>Username <span style="font-weight:400;color:var(--ink-soft);">— what they type to sign in</span></label><input name="username" value="${u.username||''}" required></div>
    <div class="field"><label>Role</label><select name="role"><option ${u.role==='Loan Officer'?'selected':''}>Loan Officer</option><option ${u.role==='Branch Manager'?'selected':''}>Branch Manager</option><option ${u.role==='Underwriter'?'selected':''}>Underwriter</option><option ${u.role==='Collections Officer'?'selected':''}>Collections Officer</option><option ${u.role==='Administrator'?'selected':''}>Administrator</option></select></div>
    <div class="field"><label>Branch</label><select name="branch">${branchOptions(u.branch_id)}</select></div>${aaFieldsHTML}`, async (data,close)=>{
      const update = {full_name:data.fullName, username:data.username.trim(), role:data.role, branch_id:data.branch};
      if(isAdmin){ update.is_approving_authority = data.isApprovingAuthority==='1'; update.approval_limit = data.approvalLimit ? Number(data.approvalLimit) : null; }
      const {error} = await sb.from('profiles').update(update).eq('id', u.id);
      if(dbErr(error)) return; showToast('User updated'); close(); await fetchTable('profiles'); renderAll();
    }, 'Save changes', true);
    if(isAdmin){
      setTimeout(()=>{
        const toggle = document.getElementById('euAaToggle'), hidden = document.getElementById('euAaHidden');
        toggle.addEventListener('click', ()=>{ const on = !toggle.classList.contains('on'); toggle.classList.toggle('on',on); hidden.value = on?'1':''; });
      },0);
    }
  }));
  c.querySelectorAll('[data-access]').forEach(b=>b.addEventListener('click',()=>modalManageAccess(b.dataset.access)));
}
function modalManageAccess(userId){
  const u = state.profiles.find(x=>x.id===userId); if(!u) return;
  const current = (u.permissions && typeof u.permissions==='object' && Object.keys(u.permissions).length) ? u.permissions : null;
  const effective = current || {}; // nothing granted yet — administrator must check each module explicitly
  const bodyHTML = `<div class="mini-note" style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;">${u.full_name} — ${u.role}${current?'':' — currently has no access beyond Overview. Check the modules you want to grant.'}</div>
  ${ALL_MODULES.map(m=>`<label style="display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;"><input type="checkbox" name="perm_${m.id}" ${effective[m.id]?'checked':''}> ${m.label}</label>`).join('')}
  <div class="mini-note" style="margin-top:10px;">Overview and Help center are always available to every signed-in user. Administrators always have full access to every page, regardless of this list.</div>`;
  openModal('Manage access — '+u.full_name, bodyHTML, async (data,close)=>{
    const permissions = {}; ALL_MODULES.forEach(m=>{ permissions[m.id] = !!data['perm_'+m.id]; });
    const {error} = await sb.from('profiles').update({permissions}).eq('id', u.id);
    if(dbErr(error)) return; showToast('Access updated for '+u.full_name); close(); await fetchTable('profiles'); renderAll();
  }, 'Save access', true);
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSettings(){
  const c = document.getElementById('content');
  const tabs = [['general','General'],['loan','Loan processing'],['notify','Notifications'],['security','Security'],['audit','Audit log']];
  c.innerHTML = `<div class="page-head"><div><h1>System settings</h1><p>Manage defaults, alerts, and organization preferences.</p></div></div>
  <div class="tabbed"><div class="tablist">${tabs.map(t=>`<button data-tab="${t[0]}" class="${settingsTab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><div id="settingsBody"></div></div>`;
  c.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ settingsTab=b.dataset.tab; renderSettings(); }));
  const body = document.getElementById('settingsBody'); const s = state.settings;
  if(settingsTab==='general'){
    body.innerHTML = `<div class="panel"><h2>Organization details</h2><p class="sub">Name, contact details, and business address</p>
    <form id="genForm"><div class="field"><label>Organization name</label><input name="orgName" value="${s.org_name||''}"></div><div class="field"><label>Contact number</label><input name="contact" value="${s.contact||''}"></div><div class="field"><label>Business address</label><input name="address" value="${s.address||''}"></div><button class="btn primary" type="submit">Save changes</button></form></div>`;
    document.getElementById('genForm').addEventListener('submit', async e=>{ e.preventDefault(); const fd=new FormData(e.target); const {error}=await sb.from('settings').update({org_name:fd.get('orgName'), contact:fd.get('contact'), address:fd.get('address')}).eq('id',1); if(dbErr(error))return; showToast('Settings saved'); await fetchTable('settings'); });
  } else if(settingsTab==='loan'){
    body.innerHTML = `<div class="panel"><h2>Loan defaults</h2><p class="sub">Application numbers, SLA, and default rates</p>
    <form id="loanForm"><div class="field-row"><div class="field"><label>SLA target (days per stage)</label><input name="slaDays" type="number" value="${s.sla_days}"></div><div class="field"><label>Default interest rate (%/month)</label><input name="defaultRate" type="number" step="0.1" value="${s.default_rate}"></div></div><div class="field"><label>Application ID prefix</label><input name="appPrefix" value="${s.app_prefix}"></div><button class="btn primary" type="submit">Save changes</button></form></div>`;
    document.getElementById('loanForm').addEventListener('submit', async e=>{ e.preventDefault(); const fd=new FormData(e.target); const {error}=await sb.from('settings').update({sla_days:Number(fd.get('slaDays')), default_rate:Number(fd.get('defaultRate')), app_prefix:fd.get('appPrefix')}).eq('id',1); if(dbErr(error))return; showToast('Settings saved'); await fetchTable('settings'); });
  } else if(settingsTab==='notify'){
    body.innerHTML = `<div class="panel"><h2>Notifications</h2><p class="sub">Configure application alerts</p>
    <div class="toggle-row"><div><div class="t">Notify on new application</div><div class="d">Alert staff when an application is submitted</div></div><button class="switch ${s.notify_new_app?'on':''}" id="tNewApp"><span class="knob"></span></button></div></div>`;
    document.getElementById('tNewApp').addEventListener('click', async ()=>{ const {error}=await sb.from('settings').update({notify_new_app:!s.notify_new_app}).eq('id',1); if(dbErr(error))return; await fetchTable('settings'); renderSettings(); });
  } else if(settingsTab==='security'){
    body.innerHTML = `<div class="panel"><h2>Security</h2><p class="sub">Password policy and login session controls</p>
    <div class="field"><label>Session timeout (minutes)</label><input id="tTimeout" type="number" value="${s.session_timeout}" style="max-width:140px;"></div>
    <div class="toggle-row"><div><div class="t">Require two-factor authentication</div><div class="d">Configure in Supabase Auth settings; this flag documents the policy.</div></div><button class="switch ${s.require_2fa?'on':''}" id="t2fa"><span class="knob"></span></button></div></div>`;
    document.getElementById('tTimeout').addEventListener('change', async e=>{ const {error}=await sb.from('settings').update({session_timeout:Number(e.target.value)}).eq('id',1); if(dbErr(error))return; showToast('Settings saved'); await fetchTable('settings'); });
    document.getElementById('t2fa').addEventListener('click', async ()=>{ const {error}=await sb.from('settings').update({require_2fa:!s.require_2fa}).eq('id',1); if(dbErr(error))return; await fetchTable('settings'); renderSettings(); });
  } else if(settingsTab==='audit'){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Audit log</h2></div><p class="sub">Every insert, update, and delete — recorded automatically by the database, latest 200 entries.</p>
    <table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Table</th><th>Record</th></tr></thead><tbody>${state.auditLog.length ? state.auditLog.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('en-PH')}</td><td>${l.actor_name||'—'}</td><td><span class="badge neutral">${l.action}</span></td><td>${l.entity}</td><td style="font-size:11.5px;color:var(--ink-soft);">${l.entity_id}</td></tr>`).join('') : '<tr class="empty-row"><td colspan="5">No activity yet.</td></tr>'}</tbody></table></div>`;
  }
}

/* ============================================================
   HELP
   ============================================================ */
function renderHelp(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="page-head"><div><h1>Help center</h1><p>Quick guidance for getting the most out of loan monitoring.</p></div></div>
  <div class="help-grid">
  <div class="help-card"><h3>The 7-step loan process</h3><ol><li><b>Enrollment</b> — register the client (full CIF) and upload documentary requirements when creating the application.</li><li><b>Validation (CIBI)</b> — assign the case to an Evaluation Staff, then run the BCRRS scorecard and cash-flow check right on the same page.</li><li><b>Endorsement</b> — once scored, click Assign to Approving Authority → to pick a specific approver (only staff an Administrator has enabled appear, each showing their approval limit) and send the case their way.</li><li><b>Evaluation report</b> — click Report on any scored application (Validation page) to print the BCRRS + cash-flow report.</li><li><b>Approving Authority decision</b> — Approve, Differ, or Disapprove, with remarks.</li><li><b>Printing</b> — print the full application package (CIF + documents) from Loan Applications.</li><li><b>Listings</b> — export Approved / Differed / Disapproved listings from Reports &amp; Listings.</li></ol></div>
  <div class="help-card"><h3>How this stays live</h3><ul><li>Every record lives in a shared Postgres database, not your browser.</li><li>Changes anyone makes appear on everyone else's screen within a second or two, automatically.</li><li>BCRRS scores, cash-flow figures, and SLA timers are calculated by the database itself, so they can't be altered from a browser.</li></ul></div>
  <div class="help-card"><h3>Frequently asked</h3><ul><li><b>I can't sign in.</b> Ask an administrator to create your account in Supabase → Authentication → Users.</li><li><b>Why is a branch's data missing?</b> Check the branch selector in the sidebar.</li><li><b>Who changed this record?</b> Check Settings → Audit log.</li><li><b>Where do uploaded files go?</b> Document Center → Document directory lists every uploaded file with a View link.</li></ul></div>
  <div class="help-card"><h3>Need more help?</h3><p style="color:var(--ink-soft);font-size:13px;">See SETUP_GUIDE.md for how this system was connected to its database, and how to add more staff, branches, or report types.</p></div>
  </div>`;
}
